# Machine-readable contract for portable LunCoSim skills. Markdown remains the
# canonical runbook source; this file supplies routing metadata to validators,
# MCP packaging, and host adapters without requiring a YAML parser.
version = 1

[contract]
required = ["name", "category", "primary_for", "defer_to", "evidence"]

[[skills]]
name = "luncosim-onboarding"
category = "orientation"
primary_for = ["where to start", "how skills work", "what LunCoSim can do"]
defer_to = ["repo-map", "capability-discovery"]
evidence = "skills/START-HERE.md"

[[skills]]
name = "repo-map"
category = "orientation"
primary_for = ["repository layout", "which binary to run"]
defer_to = ["capability-discovery"]
evidence = "docs/crates-index.md"

