[package]
name = "transform-gizmo-bevy"
description = "bevy integration for transform-gizmo"
version = "0.9.0"
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/urholaukkarinen/transform-gizmo"
repository = "https://github.com/urholaukkarinen/transform-gizmo"
authors = ["Urho Laukkarinen <urho.laukkarinen@gmail.com>"]
categories = ["gui", "game-development", "game-engines"]
keywords = ["gizmo", "bevy"]
readme = "README.md"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "**/*.wgsl", "Cargo.toml"]

[features]
default = ["gizmo_picking_backend", "mouse_interaction"]
gizmo_picking_backend = []
mouse_interaction = []

[dependencies]
transform-gizmo = { git = "https://github.com/LunCoSim/mitchty-transform-gizmo", rev = "8e5d26f6d8bcae547ed0d269f9e25cd62ceacb53" }

bevy_app = { version = "0.19", default-features = false }
bevy_core_pipeline = { version = "0.19", default-features = false }
bevy_reflect = { version = "0.19", default-features = false }
bevy_math = { version = "0.19", features = ["mint"], default-features = false }
bevy_mesh = { version = "0.19", default-features = false }
bevy_picking = { version = "0.19", default-features = false }
bevy_camera = { version = "0.19", default-features = false }
bevy_render = { version = "0.19", default-features = false }
bevy_shader = { version = "0.19", default-features = false }
bevy_input = { version = "0.19", default-features = false }
bevy_asset = { version = "0.19", default-features = false }
bevy_utils = { version = "0.19", default-features = false }
bevy_platform = { version = "0.19", default-features = false }
bevy_pbr = { version = "0.19", default-features = false }
bevy_ecs = { version = "0.19", default-features = false }
bevy_log = { version = "0.19", default-features = false }
bevy_window = { version = "0.19", default-features = false }
bevy_transform = { version = "0.19", default-features = false }
bevy_derive = { version = "0.19", default-features = false }
bevy_image = { version = "0.19", default-features = false }
bytemuck = "1.23"
uuid = "1.17"

[dev-dependencies]
bevy = "0.19"
