[package]
name = "bevy_solari"
version = "0.20.0"
edition = "2024"
description = "Provides raytraced lighting for Bevy Engine"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy"]

[dependencies]
# bevy
bevy_anti_alias = { version = "0.20.0" }
bevy_app = { version = "0.20.0" }
bevy_asset = { version = "0.20.0" }
bevy_camera = { version = "0.20.0" }
bevy_color = { version = "0.20.0" }
bevy_core_pipeline = { version = "0.20.0" }
bevy_derive = { version = "0.20.0" }
bevy_diagnostic = { version = "0.20.0" }
bevy_ecs = { version = "0.20.0" }
bevy_light = { version = "0.20.0" }
bevy_shader = { version = "0.20.0" }
bevy_math = { version = "0.20.0" }
bevy_mesh = { version = "0.20.0" }
bevy_pbr = { version = "0.20.0", features = [
  "dfg_lut",
] }
bevy_platform = { version = "0.20.0", default-features = false, features = [
  "std",
] }
bevy_reflect = { version = "0.20.0" }
bevy_render = { version = "0.20.0" }
bevy_image = { version = "0.20.0" }
bevy_utils = { version = "0.20.0" }
bevy_transform = { version = "0.20.0" }

# other
bytemuck = { version = "1" }
derive_more = { version = "2", default-features = false, features = ["from"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
wgpu = { version = "30", default-features = false }

[features]
dlss = ["bevy_anti_alias/dlss"]
force_disable_dlss = ["bevy_anti_alias/force_disable_dlss"]

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true

[package.metadata.wgsl-analyzer]
edition = "2026_pre"
root = "src"

[package.metadata.wgsl-analyzer.dependencies]
bevy_render = { path = "../bevy_render" }
bevy_pbr = { path = "../bevy_pbr" }
bevy_core_pipeline = { path = "../bevy_core_pipeline" }
constants = { path = "../../constants" }
