[package]
name = "rumoca-compile"
description = "Multi-file Modelica compilation pipeline for Rumoca"
version = "0.10.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/CogniPilot/rumoca"
homepage = "https://github.com/CogniPilot/rumoca"

[features]
default = []
tracing = ["rumoca-phase-flatten/tracing", "rumoca-phase-instantiate/tracing", "rumoca-phase-resolve/tracing", "rumoca-phase-structural/tracing"]

[dependencies]
rumoca-ir-ast = { git = "https://github.com/LunCoSim/rumoca", rev = "83641b8cf7247815d0ab80b3262113cb8622be5c" }
rumoca-ir-flat = { git = "https://github.com/LunCoSim/rumoca", rev = "83641b8cf7247815d0ab80b3262113cb8622be5c" }
rumoca-ir-dae = { git = "https://github.com/LunCoSim/rumoca", rev = "83641b8cf7247815d0ab80b3262113cb8622be5c" }
rumoca-ir-solve = { git = "https://github.com/LunCoSim/rumoca", rev = "83641b8cf7247815d0ab80b3262113cb8622be5c" }
rumoca-phase-autodiff = { git = "https://github.com/LunCoSim/rumoca", rev = "83641b8cf7247815d0ab80b3262113cb8622be5c" }
rumoca-phase-parse = { git = "https://github.com/LunCoSim/rumoca", rev = "83641b8cf7247815d0ab80b3262113cb8622be5c" }
rumoca-phase-resolve = { git = "https://github.com/LunCoSim/rumoca", rev = "83641b8cf7247815d0ab80b3262113cb8622be5c" }
rumoca-phase-typecheck = { git = "https://github.com/LunCoSim/rumoca", rev = "83641b8cf7247815d0ab80b3262113cb8622be5c" }
rumoca-phase-instantiate = { git = "https://github.com/LunCoSim/rumoca", rev = "83641b8cf7247815d0ab80b3262113cb8622be5c" }
rumoca-phase-flatten = { git = "https://github.com/LunCoSim/rumoca", rev = "83641b8cf7247815d0ab80b3262113cb8622be5c" }
rumoca-phase-dae = { git = "https://github.com/LunCoSim/rumoca", rev = "83641b8cf7247815d0ab80b3262113cb8622be5c" }
rumoca-phase-structural = { git = "https://github.com/LunCoSim/rumoca", rev = "83641b8cf7247815d0ab80b3262113cb8622be5c" }
rumoca-phase-codegen = { git = "https://github.com/LunCoSim/rumoca", rev = "83641b8cf7247815d0ab80b3262113cb8622be5c" }
rumoca-core = { git = "https://github.com/LunCoSim/rumoca", rev = "83641b8cf7247815d0ab80b3262113cb8622be5c" }
anyhow = "1.0"
indexmap = { version = "2.7", features = ["serde"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
bincode = "1.3"
flate2 = "1.0"
toml = "0.8"
thiserror = "2.0"
blake3 = "1.5"

[dev-dependencies]
tempfile = "3.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(coverage_nightly)"] }
unsafe_code = "deny"
unreachable_pub = "deny"
unnameable_types = "deny"
private_interfaces = "deny"
private_bounds = "deny"
exported_private_dependencies = "deny"
dead_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
excessive_nesting = "deny"
too_many_lines = "deny"
too_many_arguments = "deny"
pub_use = "allow"
pub_with_shorthand = "allow"
pub_without_shorthand = "allow"
missing_enforced_import_renames = "deny"
