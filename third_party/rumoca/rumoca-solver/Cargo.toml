[package]
name = "rumoca-solver"
description = "Backend-neutral simulation contracts and runtime helpers for Rumoca"
version = "0.9.20"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/CogniPilot/rumoca"

[dependencies]
rumoca-core = { git = "https://github.com/LunCoSim/rumoca", rev = "31d5a831cb2ce53a524354e0319572b0de995538" }
rumoca-ir-solve = { git = "https://github.com/LunCoSim/rumoca", rev = "31d5a831cb2ce53a524354e0319572b0de995538" }
nalgebra = "0.34"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order", "unbounded_depth"] }
thiserror = { version = "2.0" }
tracing = { version = "0.1" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
instant = { version = "0.1", features = ["wasm-bindgen"] }
