[package]
name = "rumoca-compile"
description = "Multi-file Modelica compilation pipeline for Rumoca"
version = "0.9.20"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/CogniPilot/rumoca"

[features]
default = []
strict-ir-validation = ["rumoca-phase-dae/strict-ir-validation"]
tracing = [
    "rumoca-phase-dae/tracing",
    "rumoca-phase-flatten/tracing",
    "rumoca-phase-instantiate/tracing",
    "rumoca-phase-resolve/tracing",
    "rumoca-phase-structural/tracing",
]

[dependencies]
rumoca-ir-ast = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-ir-flat = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-ir-dae = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-phase-parse = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-phase-resolve = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-phase-typecheck = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-phase-instantiate = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-phase-flatten = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-phase-dae = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-phase-structural = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-phase-codegen = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-ir-galec = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-galec-codegen = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-core = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
anyhow = "1.0"
indexmap = { version = "2.7", features = ["serde"] }
minijinja = { version = "2.5", features = ["debug", "preserve_order"] }
rayon = "1.10"
miette = { version = "7.4", features = ["fancy"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["preserve_order", "unbounded_depth"] }
bincode = "1.3"
toml = "0.8"
thiserror = "2.0"
blake3 = "1.5"

[dev-dependencies]
tempfile = "3.15"
