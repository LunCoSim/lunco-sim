[package]
name = "rumoca-eval-solve"
description = "Solve-IR row evaluator for Rumoca"
version = "0.9.20"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/CogniPilot/rumoca"
homepage = "https://github.com/CogniPilot/rumoca"

[dependencies]
indexmap = { version = "2.7", features = ["serde"] }
rumoca-core = { git = "https://github.com/LunCoSim/rumoca", rev = "31d5a831cb2ce53a524354e0319572b0de995538" }
rumoca-ir-solve = { git = "https://github.com/LunCoSim/rumoca", rev = "31d5a831cb2ce53a524354e0319572b0de995538" }
rumoca-solver = { git = "https://github.com/LunCoSim/rumoca", rev = "31d5a831cb2ce53a524354e0319572b0de995538" }
thiserror = { version = "2.0" }
tracing = { version = "0.1" }

[dev-dependencies]
rumoca-ir-dae = { git = "https://github.com/LunCoSim/rumoca", rev = "31d5a831cb2ce53a524354e0319572b0de995538" }
rumoca-eval-dae = { git = "https://github.com/LunCoSim/rumoca", rev = "31d5a831cb2ce53a524354e0319572b0de995538" }
