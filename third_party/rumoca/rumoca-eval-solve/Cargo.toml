[package]
name = "rumoca-eval-solve"
description = "Solve-IR row evaluator for Rumoca"
version = "0.9.20"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/CogniPilot/rumoca"
homepage = "https://github.com/CogniPilot/rumoca"

[dependencies]
indexmap = { version = "2.7", features = ["serde"] }
rumoca-core = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-ir-solve = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-solver = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
thiserror = { version = "2.0" }
tracing = { version = "0.1" }

[dev-dependencies]
rumoca-ir-dae = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-eval-dae = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
