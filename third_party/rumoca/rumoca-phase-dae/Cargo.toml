[package]
name = "rumoca-phase-dae"
description = "ToDae phase for the Rumoca Modelica compiler"
version = "0.9.20"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/CogniPilot/rumoca"

[features]
default = []
strict-ir-validation = [
    "rumoca-ir-flat/strict-ir-validation",
    "rumoca-ir-dae/strict-ir-validation",
]
tracing = ["dep:tracing"]

[dependencies]
rumoca-core = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-eval-dae = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-ir-flat = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
rumoca-ir-dae = { git = "https://github.com/LunCoSim/rumoca", rev = "eaa5291ff610085cfc02f9673fcb393245feaa9b" }
indexmap = "2.2"
rustc-hash = "2.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0"
miette = "7.4"
tracing = { version = "0.1", optional = true }

[lints]
workspace = true
