[package]
name = "lunco-usd"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
bevy = { workspace = true }
openusd = { workspace = true }
# An authored `xformOp:translate` on a grid-direct prim is GRID-ABSOLUTE, so
# consuming one live means re-splitting it into big_space's `(CellCoord,
# Transform)` — `live_consume` needs the `Grid` to do that split.
big_space = { workspace = true }
# Core USD subsystems — egui-free. The server keeps these: visual sync (meshes
# for colliders), avian physics mapping, sim/scene + cosim LoadScene.
lunco-usd-bevy = { path = "../lunco-usd-bevy" }
lunco-usd-compose = { path = "../lunco-usd-compose" }
lunco-usd-avian = { path = "../lunco-usd-avian" }
lunco-usd-sim = { path = "../lunco-usd-sim" }
lunco-autopilot = { path = "../lunco-autopilot" }
lunco-core = { path = "../lunco-core" }
lunco-api = { path = "../lunco-api", default-features = false }
lunco-render = { path = "../lunco-render" }
lunco-doc = { path = "../lunco-doc" }
# Only the document-lifecycle EVENTS (core); its egui systems are behind
# doc-bevy's own `ui`, re-enabled by our `ui` feature below.
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-storage = { path = "../lunco-storage" }
lunco-twin = { path = "../lunco-twin", features = ["bevy"] }
# Canonical Twin edit journal. USD records its (forward, inverse) op pairs
# here — lossless, since `UsdOp` derives `Serialize` (no hand summaries).
lunco-twin-journal = { path = "../lunco-twin-journal" }
lunco-assets = { path = "../lunco-assets" }
# Editor-session binding (WorkspaceResource + events). ECS-only, no UI — the
# binding moved here from lunco-workbench so non-ui consumers can read it.
lunco-workspace = { path = "../lunco-workspace" }
serde = { workspace = true }
# `serde_json::Value` for the hot-exit `DocumentSnapshot.view_state`
# field (USD leaves it null; Modelica fills it with a canvas Viewport).
serde_json = { workspace = true }

# UI-only: the document/file commands (commands.rs) + browser/viewport panels
# (ui/). Optional so a headless server build (`--no-default-features`) drops
# egui + the egui workbench shell entirely.
bevy_egui = { workspace = true, optional = true }
lunco-workbench = { path = "../lunco-workbench", optional = true }
lunco-workbench-core = { path = "../lunco-workbench-core", optional = true }
lunco-status-core = { path = "../lunco-status-core", optional = true }
lunco-theme = { path = "../lunco-theme", optional = true }
lunco-ui = { path = "../lunco-ui", optional = true }

[features]
default = ["ui"]
# USD document commands + browser/viewport panels (egui + workbench shell).
ui = ["dep:bevy_egui", "dep:lunco-workbench", "dep:lunco-workbench-core", "dep:lunco-status-core", "dep:lunco-theme", "dep:lunco-ui", "lunco-doc-bevy/ui"]

[[test]]
name = "apply_usd_op_integration_test"
required-features = ["ui"]

[[test]]
name = "live_spawn_projection"
required-features = ["ui"]

[dev-dependencies]
# These are used by package-local mechanism tests in `src/` (live entity
# consumption and temporary document persistence), not by cross-domain
# integration targets. The latter live in `lunco-usd-sim/tests` or the
# application package when they cross the full runtime boundary.
avian3d = { workspace = true }
tempfile = { workspace = true }
[lints]
workspace = true
