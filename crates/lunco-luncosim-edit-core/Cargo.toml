[package]
name = "lunco-luncosim-edit-core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
lunco-usd-bevy-stage = { path = "../lunco-usd-bevy-stage" }
# Runtime scene handlers and plugin composition used by the editor and headless
# hosts. UI producers that only emit shared payloads depend on
# `lunco-scene-command-contracts`, not this handler package.
lunco-scene-commands = { path = "../lunco-scene-commands" }
lunco-scene-camera = { path = "../lunco-scene-camera" }
lunco-scene-selection = { path = "../lunco-scene-selection" }
lunco-scene-catalog = { path = "../lunco-scene-catalog" }
# This crate names no `bevy_pbr` material type. Appearance is stated as intent
# and bound by `lunco-render-bevy`; see `docs/architecture/render-decoupling.md`.
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_mesh",
    "bevy_light",
    "bevy_shader",
    "keyboard",
    "mouse",
] }
# Appearance intent (render-free): `PbrLook`.
lunco-render = { path = "../lunco-render" }
# Scene-editing mechanisms use the shared settings and command/state contracts;
# rendered panels and their presentation dependencies belong to the sibling UI
# package.
avian3d = { workspace = true }

big_space.workspace = true
lunco-core = { path = "../lunco-core" }
lunco-control-core = { path = "../lunco-control-core" }
lunco-interaction-core = { path = "../lunco-interaction-core" }
lunco-spatial = { path = "../lunco-spatial" }
lunco-physics = { path = "../lunco-physics" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
# Terrain shader-mode selector (Lit / Debug-LOD / Plain) in the Inspector.
lunco-terrain-surface = { path = "../lunco-terrain-surface" }
lunco-viewport-core = { path = "../lunco-viewport-core" }

[lints]
workspace = true
