[package]
name = "lunco-celestial"
version = "0.6.0-dev"
edition = "2021"
license.workspace = true
description = "Headless celestial mechanics, ephemeris, geodesy, and semantic reference frames"

[dependencies]
# Semantic astronomy uses ECS components/resources and Bevy's double-precision
# math, but it does not depend on BigSpace, Avian, terrain, rendering, or UI.
bevy = { workspace = true }
lunco-celestial-data = { path = "../lunco-celestial-data" }
lunco-time = { path = "../lunco-time" }
serde = { workspace = true }

[lints]
workspace = true
