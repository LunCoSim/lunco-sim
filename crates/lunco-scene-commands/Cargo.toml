[package]
name = "lunco-scene-commands"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "The render-free scene/document mutation layer: runtime spawn, move, delete, camera, and USD edits authored on the open document's runtime layer"

[dependencies]
# NO `bevy_pbr` — this crate names no material type (`MeshMaterial3d`,
# `StandardMaterial`, `ShaderMaterial`). Appearance authoring lives in the
# sibling `lunco-scene-authoring` package; this package owns runtime scene
# mutation and remains render-free.
#
bevy = { workspace = true, features = ["bevy_asset", "bevy_mesh", "bevy_light", "bevy_shader"] }
avian3d = { workspace = true }

big_space.workspace = true
lunco-core = { path = "../lunco-core" }
lunco-spatial = { path = "../lunco-spatial" }
lunco-core-session = { path = "../lunco-core-session" }
# DeleteEntity removes the deleted entity from the shared scene-lifetime
# selection resource; the camera package consumes the same resource for path
# focus but does not install it by itself.
lunco-scene-selection = { path = "../lunco-scene-selection" }
lunco-doc = { path = "../lunco-doc" }
# Document-backed property and shader authoring is installed by the sibling
# `lunco-scene-authoring` plugin; this crate only owns the remaining mutation
# handlers and their runtime-layer observers.
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-api = { path = "../lunco-api" }
lunco-scene-catalog = { path = "../lunco-scene-catalog" }
lunco-scene-authoring = { path = "../lunco-scene-authoring" }
lunco-scene-queries = { path = "../lunco-scene-queries" }
lunco-usd-bevy-core = { path = "../lunco-usd-bevy-core" }
lunco-usd-bevy-light = { path = "../lunco-usd-bevy-light" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
lunco-usd-bevy-twin = { path = "../lunco-usd-bevy-twin" }
lunco-usd-core = { path = "../lunco-usd-core" }
lunco-usd-document = { path = "../lunco-usd-document" }
openusd = { workspace = true }
# Active-document resolution for C4b runtime-layer persistence (ECS-only, no UI).
lunco-workspace = { path = "../lunco-workspace" }
lunco-environment = { path = "../lunco-environment" }
lunco-physics = { path = "../lunco-physics" }
lunco-assets-core = { path = "../lunco-assets-core" }
[lints]
workspace = true
