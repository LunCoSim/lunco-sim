[package]
name = "lunco-scene-commands"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "The scene/document command layer: every runtime mutation of the scene (spawn, move, delete, set-property, shader edits) authored as journaled USD ops on the open document's runtime layer. Render-free and UI-free, so the headless server links it without the editor."

[dependencies]
# NO `bevy_pbr` — this crate names no material type (`MeshMaterial3d`,
# `StandardMaterial`, `ShaderMaterial`). Appearance is stated as INTENT
# (`lunco_render::PbrLook`, `lunco_materials::ShaderLook`) and bound by
# `lunco-render-bevy`; see `docs/architecture/render-decoupling.md`. The compiler
# is the enforcement — put `bevy_pbr` back and the rule quietly rots.
#
# `bevy_shader` is here for the live shader-AUTHORING commands only
# (`SetShaderSource`/`CreateShader`/`ImportShader` compile WGSL into
# `Assets<Shader>` so an edit renders without a disk round-trip). It pulls `naga`
# but NOT wgpu; moving those three onto an intent+binder of their own is the
# follow-up that would take naga out of the headless server too.
bevy = { workspace = true, features = ["bevy_asset", "bevy_mesh", "bevy_light", "bevy_shader"] }
# Appearance intent (render-free): `PbrLook`. Every PBR material site in this crate
# goes through it instead of `Assets<StandardMaterial>`.
lunco-render = { path = "../lunco-render" }
avian3d = { workspace = true }

big_space.workspace = true
lunco-core = { path = "../lunco-core" }
lunco-time = { path = "../lunco-time" }
# The render-free signal core — for `TelemetryFocus` only, so selection scoping
# reaches every telemetry surface without this crate learning about any of them.
# A ring buffer of f64s: no GPU stack rides in on this edge.
lunco-signal = { path = "../lunco-signal" }
lunco-celestial = { path = "../lunco-celestial", default-features = false }
lunco-doc = { path = "../lunco-doc" }
# Shader source is a journaled DOMAIN (ShaderDocument): edits record to the Twin
# journal (DomainKind::Shader) and hot-reload — like a rhai script / Modelica model.
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-twin-journal = { path = "../lunco-twin-journal" }
serde = { workspace = true }
# `QueryEntity`'s response payload (entity_query.rs).
serde_json = { workspace = true }
lunco-api = { path = "../lunco-api", default-features = false }
lunco-mobility = { path = "../lunco-mobility" }
lunco-usd = { path = "../lunco-usd", default-features = false }
lunco-usd-bevy = { path = "../lunco-usd-bevy" }
lunco-usd-bevy-core = { path = "../lunco-usd-bevy-core" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
lunco-usd-core = { path = "../lunco-usd-core" }
# `QueryUsdPrim` addresses prims by `sdf::Path`, so the read side needs the same
# path type the stage is keyed on — no conversion layer in between.
openusd = { workspace = true }
# Active-document resolution for C4b runtime-layer persistence (ECS-only, no UI).
lunco-workspace = { path = "../lunco-workspace" }
lunco-usd-sim = { path = "../lunco-usd-sim" }
lunco-usd-avian = { path = "../lunco-usd-avian" }
lunco-hooks-rhai = { path = "../lunco-hooks-rhai" }
lunco-environment = { path = "../lunco-environment" }
lunco-materials = { path = "../lunco-materials" }
lunco-physics = { path = "../lunco-physics" }
lunco-avatar = { path = "../lunco-avatar", default-features = false }
lunco-assets = { path = "../lunco-assets" }
lunco-settings = { path = "../lunco-settings" }
lunco-storage = { path = "../lunco-storage" }
lunco-scene-validation = { path = "../lunco-scene-validation" }
rhai = { workspace = true }
# The catalogue scan is async (reading a shipped asset on the web is an HTTP
# fetch), so completed reads come back over a channel and a drain system folds
# them in. `futures-lite::block_on` backs the native blocking scan used by tests.
crossbeam-channel = { workspace = true }
futures-lite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Web: a browser `fetch` future is `!Send`, so the asset reads cannot go on a
# Bevy task pool — they are driven by `spawn_local` on the JS event loop.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }

[lints]
workspace = true
