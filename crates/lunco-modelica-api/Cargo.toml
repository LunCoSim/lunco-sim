[package]
name = "lunco-modelica-api"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Transport-free API query providers for Modelica documents and runs"

[dependencies]
bevy = { workspace = true }
lunco-core = { path = "../lunco-core" }
lunco-api = { path = "../lunco-api" }
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-doc = { path = "../lunco-doc" }
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-experiments = { path = "../lunco-experiments" }
lunco-modelica-ast = { path = "../lunco-modelica-ast" }
lunco-modelica-core = { path = "../lunco-modelica-core", default-features = false }
lunco-modelica-execution = { path = "../lunco-modelica-execution" }
lunco-modelica-document = { path = "../lunco-modelica-document" }
lunco-modelica-index = { path = "../lunco-modelica-index" }
lunco-modelica-runner = { path = "../lunco-modelica-runner" }
lunco-modelica-runtime = { path = "../lunco-modelica-runtime" }
lunco-twin-journal = { path = "../lunco-twin-journal" }
serde_json = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
web-time = { workspace = true }
lunco-workspace = { path = "../lunco-workspace" }

[lints]
workspace = true

[dev-dependencies]
crossbeam-channel = { workspace = true }
