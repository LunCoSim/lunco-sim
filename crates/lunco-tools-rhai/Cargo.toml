[package]
name = "lunco-tools-rhai"
version = "0.1.0"
edition = "2021"
license.workspace = true

# rhai adapter for the runtime-agnostic lunco-tools registry: concrete tool
# impls (rhai-source + native Rust) and the binding that exposes every
# registered tool to a rhai Engine as a static module (`name::fn(...)`).
# wasm-clean (rhai only; no bevy).

[dependencies]
lunco-tools = { path = "../lunco-tools" }
# Use the same bounded Rhai parser policy as the production scripting engine
# when deriving discovery metadata from source-defined tools.
lunco-hooks-rhai = { path = "../lunco-hooks-rhai" }
rhai = { workspace = true }

[lints]
workspace = true
