[package]
name = "lunco-usd-sim-celestial"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Render-free USD celestial and link-component projection for LunCoSim"

[dependencies]
lunco-usd-bevy-stage = { path = "../lunco-usd-bevy-stage" }
bevy = { workspace = true, features = ["bevy_asset"] }
openusd = { workspace = true }
lunco-celestial = { path = "../lunco-celestial", default-features = false }
lunco-celestial-spatial-core = { path = "../lunco-celestial-spatial-core" }
lunco-environment = { path = "../lunco-environment" }
lunco-core = { path = "../lunco-core" }
lunco-time = { path = "../lunco-time" }
lunco-hooks = { path = "../lunco-hooks" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }

[dev-dependencies]
lunco-usd-compose = { path = "../lunco-usd-compose" }

[lints]
workspace = true
