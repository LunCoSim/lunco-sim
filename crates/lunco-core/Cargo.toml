[package]
name = "lunco-core"
version = "0.6.0-dev"
edition = "2021"
license.workspace = true

[dependencies]
bevy = { workspace = true }
lunco-command-contracts = { path = "../lunco-command-contracts" }
serde = { workspace = true }
lunco-command-macro = { path = "../lunco-command-macro" }
# ID generation is owned by the platform-neutral ID substrate rather than the
# ECS core, so document and protocol consumers do not pull this crate.
lunco-id = { path = "../lunco-id" }
# Deterministic provenance hashing remains an identity concern of this ECS
# component until that component is migrated as a whole.
lunco-hash = { path = "../lunco-hash" }

[lints]
workspace = true
