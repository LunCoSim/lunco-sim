[package]
name = "lunco-physics"
version = "0.1.0-dev"
edition = "2021"
license.workspace = true
description = "Physics readiness gate: suspend rigid-body integration (avian's Time<Physics>) while colliders bake — without touching the world clock or the user's transport"

[features]
# OFF by default — a DIAGNOSTIC, not a runtime setting. Turns on avian's own
# `validate`, which checks body, contact, and joint island invariants after each
# island mutation. Enable it only when investigating an Avian invariant report;
# it is not a runtime setting and is not part of performance measurements.
#
#   cargo run -j2 -p luncosim --features lunco-physics/avian-validate
#
# Cargo unifies features across the graph, so naming it on ANY crate that pulls
# avian turns it on for the whole build — this crate is the choke point every
# physics-bearing binary already depends on. Expect it to be SLOW (the linked-list
# walks are O(island) per mutation); it is for investigation, not benchmarking
# or shipping.
#
avian-validate = ["avian3d/validate"]

[dependencies]
# Substrate only — no render, no window. This crate exists to be depended on by
# the terrain/obstacle generators (which run headless and on wasm) as well as the
# apps, so it must stay as light as avian + the bevy ECS/time core.
bevy = { workspace = true }
avian3d = { workspace = true }
big_space = { workspace = true }
# The decision half of readiness: what is pending, and what policy says to do
# about it. This crate is the effector — see `src/readiness.rs`.
lunco-readiness = { workspace = true }
# Canonical WorldGrid and render/world conversion for physics queries.
lunco-core = { path = "../lunco-core" }
# Transport-free API registry only: physics owns active-frame proximity query
# semantics and registers providers without pulling HTTP or networking.
lunco-api = { path = "../lunco-api", default-features = false }
serde_json.workspace = true

# This was the ONE crate of 65 without this section, so the workspace
# `disallowed_methods` ban list — std::fs, std::thread::spawn, Instant::now,
# deferred entity writes, GridAnchor re-parenting — was not enforced here.
# Per the note above, this crate is depended on by generators that "run headless
# and on wasm", making it exactly where the wasm-portability bans matter most:
# a `std::fs` or blocking `Instant::now` added here compiles and passes
# `cargo test` on native, then breaks only in the browser.
[lints]
workspace = true
