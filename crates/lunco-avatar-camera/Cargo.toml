[package]
name = "lunco-avatar-camera"
version = "0.1.0-dev"
edition = "2024"
license.workspace = true
description = "Avatar-specific BigSpace camera and locomotion realization for LunCoSim"

[dependencies]
bevy = { workspace = true, features = ["keyboard"] }
avian3d = { workspace = true }
big_space = { workspace = true }
leafwing-input-manager = { workspace = true }
lunco-avatar-camera-core = { path = "../lunco-avatar-camera-core" }
lunco-embodiment-core = { path = "../lunco-embodiment-core" }
lunco-avatar-policy = { path = "../lunco-avatar-policy" }
lunco-camera-core = { path = "../lunco-camera-core" }
lunco-control-core = { path = "../lunco-control-core" }
lunco-celestial = { path = "../lunco-celestial", default-features = false }
lunco-celestial-spatial = { path = "../lunco-celestial-spatial", default-features = false }
lunco-celestial-spatial-core = { path = "../lunco-celestial-spatial-core" }
lunco-cosim-core = { path = "../lunco-cosim-core" }
lunco-core = { path = "../lunco-core" }
lunco-environment = { path = "../lunco-environment" }
lunco-interaction-core = { path = "../lunco-interaction-core" }
lunco-input-core = { path = "../lunco-input-core" }
lunco-port-core = { path = "../lunco-port-core" }
lunco-physics = { path = "../lunco-physics" }
lunco-render = { path = "../lunco-render" }
lunco-spatial = { path = "../lunco-spatial" }
lunco-time = { path = "../lunco-time" }
lunco-workspace = { path = "../lunco-workspace" }

[lints]
workspace = true

[dev-dependencies]
lunco-core-session = { path = "../lunco-core-session" }
