[package]
name = "lunco-usd-commands"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Headless USD document and authoring command surface"

[dependencies]
lunco-usd-bevy-stage = { path = "../lunco-usd-bevy-stage" }
lunco-assets-runtime = { path = "../lunco-assets-runtime" }
lunco-command-contracts = { path = "../lunco-command-contracts" }
bevy = { workspace = true, features = ["bevy_asset"] }
openusd = { workspace = true }
serde_json = { workspace = true }
lunco-api = { path = "../lunco-api" }
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-core = { path = "../lunco-core" }
lunco-port-core = { path = "../lunco-port-core" }
lunco-doc = { path = "../lunco-doc" }
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-storage = { path = "../lunco-storage" }
lunco-twin = { path = "../lunco-twin", features = ["bevy"] }
lunco-usd-bevy-core = { path = "../lunco-usd-bevy-core" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
lunco-usd-bevy-twin = { path = "../lunco-usd-bevy-twin" }
lunco-usd-compose = { path = "../lunco-usd-compose" }
lunco-usd-core = { path = "../lunco-usd-core" }
lunco-usd-data = { path = "../lunco-usd-data" }
lunco-usd-document = { path = "../lunco-usd-document" }
lunco-twin-journal = { path = "../lunco-twin-journal" }
lunco-workspace = { path = "../lunco-workspace" }

[dev-dependencies]
lunco-usd-queries = { path = "../lunco-usd-queries" }
tempfile = { workspace = true }

[lints]
workspace = true
