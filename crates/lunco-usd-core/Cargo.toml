[package]
name = "lunco-usd-core"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Headless OpenUSD operation, assembly, and edit-policy substrate for LunCoSim"

[dependencies]
# The core uses only Bevy's ECS-free log, math, and reflection substrate for
# authored command/document types. It does not enable rendering, windows, or
# UI features.
bevy = { workspace = true }
lunco-core = { path = "../lunco-core" }
lunco-doc = { path = "../lunco-doc" }
lunco-twin = { path = "../lunco-twin" }
lunco-usd-compose = { path = "../lunco-usd-compose" }
lunco-usd-document = { path = "../lunco-usd-document" }
serde = { workspace = true }

[lints]
workspace = true
