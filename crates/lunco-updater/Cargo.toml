[package]
name = "lunco-updater"
version = "0.1.0-dev"
edition = "2024"
license.workspace = true
description = "Native Velopack update surface for the LunCoSim application"

[dependencies]
bevy = { workspace = true }
bevy_egui = { workspace = true, features = ["render"] }
lunco-assets-transport = { path = "../lunco-assets-transport" }
lunco-settings = { path = "../lunco-settings" }
lunco-status-core = { path = "../lunco-status-core" }
lunco-theme = { path = "../lunco-theme" }
lunco-workbench-core = { path = "../lunco-workbench-core" }
lunco-workbench-widgets = { path = "../lunco-workbench-widgets" }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { workspace = true, features = ["rustls", "gzip"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
velopack = { version = "=1.2.110-ge826545", features = ["public-utils"] }

[lints]
workspace = true
