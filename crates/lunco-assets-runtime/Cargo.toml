[package]
name = "lunco-assets-runtime"
version = "0.1.0-dev"
edition = "2024"
license.workspace = true
description = "Bevy asset sources, discovery, libraries, and authored text runtime"

[dependencies]
anyhow = { workspace = true }
bevy = { workspace = true, features = ["bevy_asset"] }
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-assets-datasets = { path = "../lunco-assets-datasets" }
lunco-assets-path = { path = "../lunco-assets-path" }
lunco-core = { path = "../lunco-core" }
lunco-settings = { path = "../lunco-settings" }
lunco-storage = { path = "../lunco-storage" }
lunco-twin = { path = "../lunco-twin" }
lunco-workspace = { path = "../lunco-workspace" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[[bin]]
name = "build_asset_manifest"
path = "src/bin/build_asset_manifest.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }
crossbeam-channel = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
