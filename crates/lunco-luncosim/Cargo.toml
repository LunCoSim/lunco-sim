[package]
name = "lunco-luncosim"
version = "0.6.0-dev"
edition = "2021"
license.workspace = true
# `cargo run -p lunco-luncosim` runs the LunCoSim GUI.
default-run = "luncosim"
autobins = false

# This package is the windowed application shell. The headless runtime is owned
# by the sibling `lunco-luncosim-core` package and launched directly by the
# `lunco-luncosim-server` package.
[lib]
name = "lunco_luncosim"
path = "src/lib.rs"

[[bin]]
name = "luncosim"
path = "src/bin/luncosim.rs"
# Single desktop+web source: `build_web.sh build luncosim` compiles `lib.rs`'s
# `run()` (via this bin) for `wasm32` — `#[cfg(target_arch = "wasm32")]` blocks
# in the lib handle platform differences. Served at `dist/luncosim/`.

[[example]]
name = "usd_rover_visual"
path = "examples/usd_rover_visual.rs"
required-features = ["ui"]

[dependencies]
lunco-luncosim-core = { path = "../lunco-luncosim-core", default-features = false }
lunco-luncosim-ui = { path = "../lunco-luncosim-ui", default-features = false, optional = true }
lunco-scripting = { path = "../lunco-scripting" }
lunco-scene-validation = { path = "../lunco-scene-validation" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lunco-rhai-repl = { path = "../lunco-rhai-repl" }
# The authored scene-test command is a production runner, but its readiness
# harness is a separate native edge so runner edits do not rebuild this GUI
# composition crate.
lunco-scene-runner = { path = "../lunco-scene-runner", default-features = false }
# Native desktop startup hooks for the windowed `luncosim`.
velopack = { version = "=1.2.110-ge826545", optional = true, features = ["public-utils"] }

[features]
# `ui` + `api-transport` are on by default so native `cargo run --bin luncosim`
# starts a local windowed simulation. Networking is deliberately opt-in: a normal
# desktop run or automated scene test must not bind a multiplayer host port. Build
# the wire explicitly with `--features networking`, or use the headless server
# package. The alternate headless feature set drops the GUI:
#   cargo build -p lunco-luncosim --bin luncosim --no-default-features --features server
# which omits winit/wayland/x11/egui/picking/gizmos + the workbench/material/doc
# UI crates entirely — the SAME `luncosim` bin, just a different feature set. Single-
# player with no wire: `--no-default-features --features ui,celestial,lunco-api`.
# The wasm build sets its own feature set (`--no-default-features`), so this
# default does not affect it.
default = ["ui", "celestial", "api-transport", "transport-http", "sysml"]
# Windowed GUI and its complete renderer/presentation closure. The application
# shell only enables the existing UI package; that package owns the Bevy
# render features, window configuration, capture, and presentation.
ui = [
    "dep:velopack",
    "dep:lunco-luncosim-ui",
    "lunco-scene-runner/ui",
    "lunco-luncosim-ui/avatar-ui",
]
# Lean headless multiplayer server: API + networking host, NO `ui`. Build with
# `--no-default-features --features server`. Skips `celestial` (bundled Earth
# texture + ephemeris, ~10s of MB) — the server only needs `GravityPlugin`,
# always compiled.
server = ["api-transport", "transport-http", "networking"]
# `celestial` pulls in lunco-celestial's bundled Earth texture + Artemis-II
# ephemeris (10s of MB). Off for the wasm luncosim build — it only needs
# `GravityPlugin`, which is always compiled.
celestial = ["lunco-luncosim-core/celestial"]
luncosim = []
# Compile the API in. Transport is chosen automatically: the native HTTP
# server comes from `lunco-api-transport/transport-http` (added to `default` above);
# the wasm build gets the
# `window.lunco_api` JS bridge automatically via `cfg(target_arch="wasm32")`.
api-transport = ["lunco-luncosim-core/api-transport", "lunco-luncosim-ui?/api-transport"]
# Native HTTP API transport (axum/TcpListener) — also the gate for the in-app
# rhai REPL panel, which needs `lunco_api_transport::ApiBridge` (present under this feature
# on native, and always on wasm). In `default` + `server`; the wasm build gets
# the bridge automatically via `cfg(target_arch="wasm32")`.
transport-http = [
    "lunco-luncosim-core/transport-http",
    "lunco-luncosim-ui?/transport-http",
]
# Multiplayer over WebTransport (lightyear). Pulls in the real networking
# adapter; the wire substrate (lunco-api) is required.
networking = [
    "lunco-luncosim-core/networking",
    "lunco-luncosim-ui?/networking",
    "api-transport",
]
# Netcode jitter diagnostics — off by default (not in normal builds). Build with
# `--features networking,net-diag` when debugging; see lunco-networking/diagnostics.rs.
net-diag = ["networking", "lunco-luncosim-core/net-diag"]
python = [
    "lunco-scripting/python",
    "lunco-luncosim-core/python",
    "lunco-luncosim-ui?/python",
]
native-plugins = [
    "lunco-luncosim-core/native-plugins",
    "lunco-scripting/native-plugins",
]
# Optional HTTPS support for `luncosim rhai --api-url`; local loopback HTTP
# remains the default without compiling the TLS backend.
rhai-tls = ["lunco-rhai-repl/tls"]
sysml = ["lunco-luncosim-core/sysml", "lunco-scene-runner/sysml"]
# Tracy profiler. Enable with `--features tracy` and connect a Tracy
# GUI to see per-system flame graphs. Match the GUI version to the
# tracy-client version pulled in by Bevy 0.18 (check `cargo tree -p
# tracy-client` after enabling).
tracy = ["lunco-luncosim-ui?/tracy"]

[lints]
workspace = true

[dev-dependencies]
bevy = { workspace = true }
avian3d = { workspace = true }
lunco-api-transport = { path = "../lunco-api-transport", default-features = false }
lunco-core = { path = "../lunco-core" }
lunco-mobility = { path = "../lunco-mobility" }
lunco-scripting-bridge-core = { path = "../lunco-scripting-bridge-core" }
lunco-usd-bevy-runtime = { path = "../lunco-usd-bevy-runtime" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
lunco-workspace = { path = "../lunco-workspace" }
