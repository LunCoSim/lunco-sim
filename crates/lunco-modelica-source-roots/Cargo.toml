[package]
name = "lunco-modelica-source-roots"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Twin and workspace Modelica source-root admission for the Rumoca worker"

[dependencies]
bevy.workspace = true
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-assets-path = { path = "../lunco-assets-path" }
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-doc = { path = "../lunco-doc" }
lunco-modelica-document = { path = "../lunco-modelica-document" }
lunco-modelica-index = { path = "../lunco-modelica-index" }
lunco-modelica-runtime = { path = "../lunco-modelica-runtime" }
lunco-twin = { path = "../lunco-twin", features = ["bevy"] }
lunco-workspace = { path = "../lunco-workspace" }
rumoca-compile.workspace = true
log = { version = "0.4", features = ["max_level_debug", "release_max_level_info"] }
web-time.workspace = true

[dev-dependencies]
lunco-storage = { path = "../lunco-storage" }
tempfile.workspace = true

[lints]
workspace = true
