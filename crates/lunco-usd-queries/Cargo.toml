[package]
name = "lunco-usd-queries"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "UI-free public query providers for USD documents and edit sessions"

[dependencies]
lunco-usd-bevy-stage = { path = "../lunco-usd-bevy-stage" }
bevy = { workspace = true }
lunco-api = { path = "../lunco-api" }
lunco-api-core = { path = "../lunco-api-core" }
lunco-doc = { path = "../lunco-doc" }
# Query providers are shared by headless/API hosts. The optional egui bridge is
# a UI composition concern and must not enter this crate's dependency closure.
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-usd-bevy-twin = { path = "../lunco-usd-bevy-twin" }
lunco-usd-authoring = { path = "../lunco-usd-authoring" }
lunco-usd-compose = { path = "../lunco-usd-compose" }
lunco-usd-core = { path = "../lunco-usd-core" }
lunco-usd-data = { path = "../lunco-usd-data" }
lunco-usd-document = { path = "../lunco-usd-document" }
openusd = { workspace = true }

[lints]
workspace = true
