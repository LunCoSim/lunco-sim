[package]
name = "lunco-usd-bevy"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
# RENDER-FREE by construction (docs/architecture/render-decoupling.md): NO
# `bevy_pbr` / `bevy_core_pipeline` / `bevy_post_process` / `bevy_anti_alias` /
# `tonemapping_luts` — each of those pulls `bevy_render` → wgpu + naga into the
# `--no-ui` server and the wasm worker. This crate states appearance and camera
# INTENT (`lunco_render::{PbrLook, SceneCamera}`); `lunco-render-bevy` binds it.
# `cargo tree -p lunco-usd-bevy -i wgpu` must report "package ID not found".
#
# `zstd_rust`: `bevy_image` refuses to build without a zstd backend chosen; the
# pure-Rust (ruzstd) one keeps `cargo test -p lunco-usd-bevy` standalone and
# wasm-compatible.
#
# NO `mesh_picking`: this crate contains no picking code (it builds scene data),
# and the feature pulls the raycast BACKEND — cursor-driven hit-testing that a
# `--no-ui` server has no cursor for. A GUI build still gets it, from the crates
# that actually pick (`lunco-luncosim`, `lunco-luncosim-edit-core`, `luncosim`).
bevy = { workspace = true, features = ["bevy_gltf", "bevy_mesh", "bevy_light", "zstd_rust"] }
# `Mesh`, `Mesh3d`, `Indices`, `PrimitiveTopology` — render-FREE (depends only on
# `wgpu-types`). Named directly so mesh building never reaches for
# `bevy::render::render_resource`, which is a `bevy_render` (wgpu + naga)
# re-export. See docs/architecture/render-decoupling.md.
bevy_mesh = { workspace = true }
# Numeric geometry is isolated in `lunco-usd-geometry`. Keeping truck/spade out
# of this manifest means evaluator changes rebuild that package, not this USD
# stage loader and its runtime projection systems.
lunco-usd-geometry = { path = "../lunco-usd-geometry" }
lunco-usd-bevy-lathe = { path = "../lunco-usd-bevy-lathe" }
lunco-usd-bevy-light = { path = "../lunco-usd-bevy-light" }
lunco-usd-bevy-core = { path = "../lunco-usd-bevy-core" }
lunco-usd-bevy-camera = { path = "../lunco-usd-bevy-camera" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
openusd = { workspace = true }
lunco-core = { path = "../lunco-core" }
lunco-time = { path = "../lunco-time" }
lunco-render = { path = "../lunco-render" }
lunco-materials = { path = "../lunco-materials" }
big_space = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
lunco-usd-core = { path = "../lunco-usd-core" }


[lints]
workspace = true
