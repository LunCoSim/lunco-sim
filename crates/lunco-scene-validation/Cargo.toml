[package]
name = "lunco-scene-validation"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Production asset, loaded-stage, and Twin validation for LunCoSim"

[dependencies]
lunco-usd-bevy-stage = { path = "../lunco-usd-bevy-stage" }
lunco-assets-runtime = { path = "../lunco-assets-runtime" }
bevy = { workspace = true, features = ["bevy_asset"] }
openusd = { workspace = true }
lunco-api = { path = "../lunco-api" }
lunco-api-core = { path = "../lunco-api-core" }
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-assets-path = { path = "../lunco-assets-path" }
lunco-storage = { path = "../lunco-storage" }
lunco-core = { path = "../lunco-core" }
lunco-core-runtime = { path = "../lunco-core-runtime", optional = true }
lunco-port-core = { path = "../lunco-port-core" }
lunco-control-core = { path = "../lunco-control-core" }
lunco-doc = { path = "../lunco-doc" }
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-hooks = { path = "../lunco-hooks" }
lunco-hooks-rhai = { path = "../lunco-hooks-rhai" }
lunco-hash = { path = "../lunco-hash" }
lunco-lint = { path = "../lunco-lint" }
lunco-materials = { path = "../lunco-materials" }
lunco-modelica-ast = { path = "../lunco-modelica-ast" }
lunco-sysml-ast = { path = "../lunco-sysml-ast" }
lunco-sysml = { path = "../lunco-sysml", optional = true }
lunco-tools = { path = "../lunco-tools" }
lunco-twin = { path = "../lunco-twin" }
lunco-usd-avian-lint = { path = "../lunco-usd-avian-lint" }
lunco-usd-avian = { path = "../lunco-usd-avian" }
lunco-usd-bevy-core = { path = "../lunco-usd-bevy-core" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
lunco-usd-bevy-twin = { path = "../lunco-usd-bevy-twin" }
lunco-usd-authoring = { path = "../lunco-usd-authoring" }
lunco-usd-document = { path = "../lunco-usd-document" }
lunco-usd-compose = { path = "../lunco-usd-compose" }
lunco-usd-sim-authoring = { path = "../lunco-usd-sim-authoring" }
lunco-workspace = { path = "../lunco-workspace" }
rhai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default = []
sysml-runtime = ["dep:lunco-core-runtime", "dep:lunco-sysml"]

[lints]
workspace = true
