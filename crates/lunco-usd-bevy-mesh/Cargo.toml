[package]
name = "lunco-usd-bevy-mesh"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Render-free USD geometry projection into Bevy mesh assets"

[dependencies]
bevy = { workspace = true, features = ["bevy_asset", "bevy_mesh"] }
bevy_mesh = { workspace = true }
lunco-render = { path = "../lunco-render" }
lunco-usd-bevy-core = { path = "../lunco-usd-bevy-core" }
lunco-usd-bevy-lathe = { path = "../lunco-usd-bevy-lathe" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
lunco-usd-geometry = { path = "../lunco-usd-geometry" }
openusd = { workspace = true }

[dev-dependencies]
lunco-usd-core = { path = "../lunco-usd-core" }

[lints]
workspace = true
