[package]
name = "lunco-assets-core"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Lightweight LunCoSim asset identity, resolution, storage, and shared fetch contracts"

[dependencies]
bevy = { workspace = true, features = ["bevy_asset"] }
lunco-assets-path = { path = "../lunco-assets-path" }
lunco-settings = { path = "../lunco-settings" }
lunco-storage = { path = "../lunco-storage" }
lunco-twin = { path = "../lunco-twin" }
thiserror = { workspace = true }
dirs = "5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Response",
    "Request",
    "RequestInit",
    "RequestMode",
    "Cache",
    "CacheStorage",
    "Headers",
] }
ruzstd = "0.7"
tar = { workspace = true }

[dev-dependencies]
futures-lite = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
