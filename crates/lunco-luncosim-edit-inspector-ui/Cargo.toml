[package]
name = "lunco-luncosim-edit-inspector-ui"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Inspector and authored USD panels for LunCoSim's scene editor"

[dependencies]
lunco-usd-bevy-stage = { path = "../lunco-usd-bevy-stage" }
lunco-command-contracts = { path = "../lunco-command-contracts" }
lunco-telemetry-core = { path = "../lunco-telemetry-core" }
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_mesh",
    "bevy_light",
    "bevy_shader",
    "bevy_post_process",
    "bevy_anti_alias",
    "bevy_gizmos",
] }
egui = { workspace = true }
openusd = { workspace = true }
avian3d = { workspace = true }
big_space.workspace = true

lunco-api = { path = "../lunco-api" }
lunco-embodiment-core = { path = "../lunco-embodiment-core" }
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-celestial = { path = "../lunco-celestial", default-features = false }
lunco-core = { path = "../lunco-core" }
lunco-port-core = { path = "../lunco-port-core" }
lunco-control-core = { path = "../lunco-control-core" }
lunco-doc = { path = "../lunco-doc" }
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-environment = { path = "../lunco-environment" }
lunco-materials = { path = "../lunco-materials" }
lunco-modelica-runtime = { path = "../lunco-modelica-runtime" }
lunco-modelica-ui-core = { path = "../lunco-modelica-ui-core" }
lunco-obstacle-field = { path = "../lunco-obstacle-field" }
lunco-luncosim-edit-inspector-core = { path = "../lunco-luncosim-edit-inspector-core" }
lunco-physics = { path = "../lunco-physics" }
lunco-render = { path = "../lunco-render" }
lunco-scene-authoring = { path = "../lunco-scene-authoring" }
lunco-scene-catalog = { path = "../lunco-scene-catalog" }
lunco-scene-commands = { path = "../lunco-scene-commands" }
lunco-scene-selection = { path = "../lunco-scene-selection" }
lunco-terrain-surface = { path = "../lunco-terrain-surface" }
lunco-time = { path = "../lunco-time" }
lunco-usd-bevy-core = { path = "../lunco-usd-bevy-core" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
lunco-usd-authoring = { path = "../lunco-usd-authoring" }
lunco-usd-data = { path = "../lunco-usd-data" }
lunco-usd-core = { path = "../lunco-usd-core" }
lunco-usd-document = { path = "../lunco-usd-document" }
lunco-usd-viewport-core = { path = "../lunco-usd-viewport-core" }
lunco-interaction-core = { path = "../lunco-interaction-core" }
lunco-viewport-core = { path = "../lunco-viewport-core" }
lunco-workbench-core = { path = "../lunco-workbench-core" }
lunco-workbench-widgets = { path = "../lunco-workbench-widgets" }

[lints]
workspace = true
