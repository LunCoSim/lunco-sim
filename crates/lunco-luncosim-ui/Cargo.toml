[package]
name = "lunco-luncosim-ui"
version = "0.1.0-dev"
edition = "2024"
license.workspace = true
description = "LunCoSim's interactive application UI shell"

[features]
default = []
# The transport-free API contracts and offscreen recording surface. The
# in-process Rhai REPL bridge is enabled separately by `transport-http` on
# native and is target-provided on wasm.
api-transport = [
    "dep:lunco-api-transport",
    "dep:lunco-celestial-spatial",
    "dep:lunco-modelica-core",
    "dep:lunco-modelica-execution",
    "dep:lunco-scene-camera",
    "dep:lunco-scene-commands",
    "dep:lunco-scripting-bridge-core",
    "lunco-luncosim-runtime/api-transport",
    "lunco-modelica-ui/api",
]
# Native HTTP transport for the in-process Rhai REPL panel. The panel remains
# transport-agnostic at the request boundary; this feature only supplies the
# host bridge on native.
transport-http = ["api-transport", "lunco-api-transport/transport-http"]
# Source-palette presentation for Python-backed programs.
python = []
# Embodiment's egui presentation belongs to the application UI shell rather than
# the headless-safe simulation runtime.
avatar-ui = ["dep:lunco-avatar-ui"]
# Downloaded Twin presentation in the Scenarios menu.
networking = [
    "dep:lunco-networking",
    "dep:lunco-networking-sync",
    "dep:lunco-storage",
    "lunco-networking/networking",
    "lunco-luncosim-runtime/networking",
]
# Native Velopack update checks and package installation. Kept opt-in for
# consumers that use the interactive UI shell without desktop packaging.
updates = ["dep:lunco-updater"]
# Rasterize and embed the platform icon only for native package builds. Normal
# UI development keeps the icon installer inactive, so the build script does
# not compile the SVG/image toolchain.
package-icons = [
    "dep:resvg",
    "dep:usvg",
    "dep:image",
    "dep:winresource",
]
# Opt-in profiling for the complete GPU-backed application composition.
tracy = ["bevy/trace_tracy"]

[dependencies]
lunco-assets-runtime = { path = "../lunco-assets-runtime" }
lunco-core-runtime = { path = "../lunco-core-runtime" }
lunco-telemetry-core = { path = "../lunco-telemetry-core" }
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_mesh",
    "bevy_light",
    "bevy_window",
    "bevy_winit",
    "bevy_picking",
    "bevy_input_focus",
    "mesh_picking",
    "bevy_ui_render",
    "file_watcher",
    "bevy_post_process",
    "bevy_anti_alias",
    "smaa_luts",
    "tonemapping_luts",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "keyboard",
    "png",
    "webgl2",
] }
big_space = { workspace = true }
bevy_egui = { workspace = true, features = ["render"] }
bevy_winit = { version = "0.19" }
winit = { version = "0.30.13" }
num_cpus = { workspace = true }

lunco-api-contracts = { path = "../lunco-api-contracts" }
lunco-api-transport = { path = "../lunco-api-transport", default-features = false, optional = true }
lunco-updater = { path = "../lunco-updater", optional = true }
lunco-assets-datasets = { path = "../lunco-assets-datasets" }
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-assets = { path = "../lunco-assets" }
lunco-capture = { path = "../lunco-capture", features = ["api"] }
lunco-embodiment-core = { path = "../lunco-embodiment-core" }
lunco-avatar-camera = { path = "../lunco-avatar-camera" }
lunco-avatar-input = { path = "../lunco-avatar-input" }
lunco-avatar-ui = { path = "../lunco-avatar-ui", optional = true }
lunco-celestial = { path = "../lunco-celestial", default-features = false }
lunco-camera-celestial = { path = "../lunco-camera-celestial" }
lunco-celestial-spatial = { path = "../lunco-celestial-spatial", default-features = false, optional = true }
lunco-celestial-spatial-core = { path = "../lunco-celestial-spatial-core" }
lunco-core = { path = "../lunco-core" }
lunco-control-core = { path = "../lunco-control-core" }
lunco-camera-core = { path = "../lunco-camera-core" }
lunco-camera-runtime = { path = "../lunco-camera-runtime" }
lunco-core-session = { path = "../lunco-core-session" }
lunco-exposure-core = { path = "../lunco-exposure-core" }
lunco-input-ui = { path = "../lunco-input-ui" }
lunco-doc = { path = "../lunco-doc" }
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-hooks = { path = "../lunco-hooks" }
lunco-luncosim-edit-core = { path = "../lunco-luncosim-edit-core" }
lunco-luncosim-edit-ui = { path = "../lunco-luncosim-edit-ui" }
lunco-luncosim-edit-inspector-ui = { path = "../lunco-luncosim-edit-inspector-ui" }
lunco-luncosim-core = { path = "../lunco-luncosim-core", default-features = false }
lunco-luncosim-simulation = { path = "../lunco-luncosim-simulation", default-features = false }
lunco-luncosim-runtime = { path = "../lunco-luncosim-runtime", default-features = false }
lunco-luncosim-services = { path = "../lunco-luncosim-services", default-features = false }
lunco-usd-prim-tree-ui = { path = "../lunco-usd-prim-tree-ui" }
lunco-modelica-core = { path = "../lunco-modelica-core", default-features = false, optional = true }
lunco-modelica-execution = { path = "../lunco-modelica-execution", optional = true }
lunco-modelica-document = { path = "../lunco-modelica-document" }
lunco-modelica-ui-core = { path = "../lunco-modelica-ui-core" }
lunco-modelica-ui = { path = "../lunco-modelica-ui", default-features = false, features = ["ui"] }
lunco-networking = { path = "../lunco-networking", default-features = false, optional = true }
lunco-networking-sync = { path = "../lunco-networking-sync", optional = true }
lunco-render = { path = "../lunco-render" }
lunco-render-bevy = { path = "../lunco-render-bevy" }
lunco-render-recovery = { path = "../lunco-render-recovery" }
lunco-scene-commands = { path = "../lunco-scene-commands", optional = true }
lunco-scene-camera = { path = "../lunco-scene-camera", optional = true }
lunco-scene-selection = { path = "../lunco-scene-selection" }
lunco-scene-catalog = { path = "../lunco-scene-catalog" }
lunco-scripting = { path = "../lunco-scripting", default-features = false, features = ["window-audience"] }
lunco-scripting-rhai-core = { path = "../lunco-scripting-rhai-core" }
lunco-scripting-rhai-runtime = { path = "../lunco-scripting-rhai-runtime" }
lunco-scripting-bridge-core = { path = "../lunco-scripting-bridge-core", optional = true }
lunco-settings = { path = "../lunco-settings" }
lunco-status-core = { path = "../lunco-status-core" }
lunco-terrain-surface = { path = "../lunco-terrain-surface" }
lunco-theme = { path = "../lunco-theme" }
lunco-time = { path = "../lunco-time" }
lunco-twin = { path = "../lunco-twin", features = ["bevy"] }
lunco-ui = { path = "../lunco-ui" }
lunco-usd-bevy-camera = { path = "../lunco-usd-bevy-camera" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
lunco-usd-bevy-runtime-core = { path = "../lunco-usd-bevy-runtime-core" }
lunco-usd-bevy-twin = { path = "../lunco-usd-bevy-twin" }
lunco-usd-core = { path = "../lunco-usd-core" }
lunco-usd-document = { path = "../lunco-usd-document" }
lunco-usd-ui = { path = "../lunco-usd-ui" }
lunco-usd-viewport-runtime = { path = "../lunco-usd-viewport-runtime" }
lunco-usd-viewport-ui = { path = "../lunco-usd-viewport-ui" }
lunco-luncosim-presentation = { path = "../lunco-luncosim-presentation" }
lunco-web = { workspace = true }
lunco-workbench = { path = "../lunco-workbench", features = ["api"] }
lunco-workbench-perf-ui = { path = "../lunco-workbench-perf-ui" }
lunco-workbench-runtime-ui = { path = "../lunco-workbench-runtime-ui" }
lunco-workbench-state = { path = "../lunco-workbench-state" }
lunco-workbench-window = { path = "../lunco-workbench-window" }
lunco-workbench-browser = { path = "../lunco-workbench-browser" }
lunco-workbench-core = { path = "../lunco-workbench-core" }
lunco-workbench-guided-ui = { path = "../lunco-workbench-guided-ui" }
lunco-workbench-widgets = { path = "../lunco-workbench-widgets" }
lunco-workspace = { path = "../lunco-workspace" }
lunco-storage = { path = "../lunco-storage", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
# The desktop icon is UI/package artwork. Keeping rasterization here prevents
# the headless application and server from compiling the graphics toolchain.
# These are optional because Cargo always compiles build dependencies for a
# package, even when the package's normal features do not use the generator.
resvg = { workspace = true, optional = true }
usvg = { workspace = true, optional = true }
image = { workspace = true, features = ["ico"], optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.31", optional = true }

[package.metadata.cargo-machete]
# Cargo machete does not inspect build.rs; these dependencies rasterize and
# package the desktop icon there and are intentionally build-only and
# packaging-feature-only.
ignored = ["image", "resvg", "usvg", "winresource"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Location"] }

[lints]
workspace = true
