[package]
name = "lunco-modelica-library"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Modelica source-library admission, artifacts, and worker bridge"

[dependencies]
bevy.workspace = true
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-doc = { path = "../lunco-doc" }
lunco-modelica-index = { path = "../lunco-modelica-index" }
lunco-settings = { path = "../lunco-settings" }
rumoca-compile.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
ruzstd = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "CssStyleDeclaration",
    "Window",
    "Cache",
    "CacheStorage",
    "File",
    "FileList",
    "FileReader",
    "Blob",
    "Request",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
    "Storage",
] }

[lints]
workspace = true
