[package]
name = "lunco-assets-download"
version = "0.1.0-dev"
edition = "2021"
license.workspace = true
description = "Manifest-aware LunCoSim asset download, extraction, and atomic installation"

[dependencies]
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-assets-path = { path = "../lunco-assets-path" }
lunco-assets-datasets = { path = "../lunco-assets-datasets" }
lunco-assets-transport = { path = "../lunco-assets-transport" }
lunco-settings = { path = "../lunco-settings" }
sha2 = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bzip2 = "0.4"
flate2 = "1.0"
rayon = { workspace = true }
tar = { workspace = true }

[dev-dependencies]
lunco-storage = { path = "../lunco-storage" }
tempfile = { workspace = true }

[lints]
workspace = true
