[package]
name = "lunco-scene-runner"
version = "0.1.0-dev"
edition = "2024"
license.workspace = true
description = "Production headless runner for authored USD and Rhai scene checks"

[lib]
name = "lunco_scene_runner"
path = "src/lib.rs"

[dependencies]
lunco-telemetry-core = { path = "../lunco-telemetry-core" }
avian3d = { workspace = true }
bevy = { workspace = true, features = ["bevy_asset", "bevy_mesh", "bevy_light"] }
big_space = { workspace = true }
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-celestial-spatial = { path = "../lunco-celestial-spatial", default-features = false }
lunco-core = { path = "../lunco-core" }
lunco-cosim-core = { path = "../lunco-cosim-core" }
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-luncosim-core = { path = "../lunco-luncosim-core", default-features = false }
lunco-luncosim-runtime = { path = "../lunco-luncosim-runtime", default-features = false }
lunco-luncosim-edit-ui = { path = "../lunco-luncosim-edit-ui", optional = true }
lunco-modelica-runtime = { path = "../lunco-modelica-runtime" }
lunco-physics = { workspace = true }
lunco-readiness = { workspace = true }
lunco-scene-validation = { path = "../lunco-scene-validation" }
lunco-scripting = { path = "../lunco-scripting" }
lunco-settings = { path = "../lunco-settings", optional = true }
lunco-time = { path = "../lunco-time" }
lunco-terrain-surface = { path = "../lunco-terrain-surface" }
lunco-twin = { path = "../lunco-twin" }
lunco-usd-avian-contracts = { path = "../lunco-usd-avian-contracts" }
lunco-usd-avian-joints = { path = "../lunco-usd-avian-joints" }
lunco-usd-avian-core = { path = "../lunco-usd-avian-core" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
lunco-usd-bevy-runtime-core = { path = "../lunco-usd-bevy-runtime-core" }
lunco-usd-document = { path = "../lunco-usd-document" }
lunco-usd-sim-core = { path = "../lunco-usd-sim-core" }
lunco-usd-sim-cosim = { path = "../lunco-usd-sim-cosim" }

[features]
ui = [
    "dep:lunco-luncosim-edit-ui",
    "dep:lunco-settings",
    "bevy/bevy_mesh",
    "bevy/bevy_light",
]
sysml = ["lunco-luncosim-core/sysml"]

[lints]
workspace = true
