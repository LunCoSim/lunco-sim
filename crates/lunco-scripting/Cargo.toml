[package]
name = "lunco-scripting"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
bevy = { workspace = true }
lunco-doc = { path = "../lunco-doc" }
# The task-tree tick engine (`this.task` in scenarios) — scripts author pure
# data maps; the dependency-free kernel ticks them (see src/task_tree.rs).
lunco-behavior = { path = "../lunco-behavior" }
# Shared per-document diagnostics store (the unified error-reporting substrate
# used by Modelica + scripting). `default-features = false` drops its egui `ui`
# feature so headless / wasm scripting builds don't pull bevy_egui→winit.
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-scripting-bridge-core = { path = "../lunco-scripting-bridge-core", optional = true }
# `ScriptOp` implements `OpPayload` (DomainKind::Script) so live script edits
# auto-record into the canonical Twin journal — same "sync by default" bridge
# Modelica/USD use. `attach_journal_recorder` (in lunco-doc-bevy) needs the trait.
lunco-twin-journal = { path = "../lunco-twin-journal" }
# Optional Python one-shot execution is exposed as a typed `#[Command]`
# (`RunPython`) via the macros + `Ack`/`OpId`/`CommandResults` substrate in
# lunco-core. The API discovers it by reflection (AppTypeRegistry) — no direct
# lunco-api dep. Lua remains only a reserved language id; it has no command.
lunco-core = { path = "../lunco-core" }
lunco-spatial = { path = "../lunco-spatial" }
lunco-core-session = { path = "../lunco-core-session" }
# Render recovery is an application-edge policy provider. Keep it optional and
# out of the default Rhai/world bridge so headless hosts do not acquire Bevy's
# GPU graph merely to register generic scripted policies.
lunco-render-recovery = { path = "../lunco-render-recovery", optional = true }
# The Rhai tutorial bridge reads the controller-owned resolved keymap. Optional
# so Python-only and script-free builds do not acquire the input projection.
lunco-controller = { path = "../lunco-controller", optional = true }
lunco-physics = { path = "../lunco-physics" }
# For the readiness policy hook id registered in `register_builtin_policies`.
lunco-readiness = { workspace = true }
# `fnv1a64` — content-address a scenario's source to a cache key for the
# compiled-AST memo (Substrate E fast tier; local/ephemeral, never on wire).
lunco-hash = { path = "../lunco-hash" }
lunco-time = { path = "../lunco-time" }
lunco-storage = { path = "../lunco-storage" }
pyo3 = { version = "0.23", optional = true }
libloading = { version = "0.8", optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
anyhow = { workspace = true }
# Default scripting backend: pure-Rust, wasm-clean, sandboxed. Optional so the
# crate (and any binary) can be built with no interpreter at all.
rhai = { workspace = true, optional = true }
# Only the rhai World-bridge needs this: `cmd()` triggers `ApiCommandEvent`
# (reusing the macro-reflected dispatcher + id-resolution), and reads resolve
# `GlobalEntityId` via `ApiEntityRegistry`. Optional + gated on `rhai` so the
# python-only / script-free builds don't pull it. No cycle: lunco-api has no
# dep on lunco-scripting (it discovers RunRhai by reflection).
# Only the transport-free reflect-dispatch types (ApiCommandEvent) and
# ApiEntityRegistry are needed here. Application roots add the outward
# transport package separately.
lunco-api = { path = "../lunco-api", optional = true }
lunco-celestial-spatial = { path = "../lunco-celestial-spatial", default-features = false }
# Tool libraries: the runtime-agnostic registry (lunco-tools) + its rhai binding
# (lunco-tools-rhai). Gated on `rhai` since the binding + scenario runtime are
# rhai; the registry itself is dependency-light.
lunco-tools = { path = "../lunco-tools", optional = true }
lunco-tools-rhai = { path = "../lunco-tools-rhai", optional = true }
# `policy→rhai` hooks: compile+register the built-in `assets/scripting/policy/*.rhai`
# decision functions (spec 034 control-authority) under their hook ids at startup.
lunco-hooks = { path = "../lunco-hooks", optional = true }
lunco-hooks-rhai = { path = "../lunco-hooks-rhai", optional = true }
# The prelude + built-in tool libraries + example scenarios are authored under
# `assets/scripting/` and embedded at compile time (wasm has no fs). That embed
# is owned by lunco-assets-core (the shared asset-access crate) — we consume it via
# `lunco_assets_core::scripting::{prelude_files, tool_libraries, examples}`. Drop a
# `.rhai` in the folder, rebuild, and it's picked up with no code edit here.
lunco-assets-datasets = { path = "../lunco-assets-datasets" }
lunco-assets-core = { path = "../lunco-assets-core" }
# Twin persistence: the `TwinAdded` event + `WorkspaceResource` (twin→root path)
# let the tool-library loader scan `<twin>/tools/*.rhai` on open. Gated on `rhai`
# (the tool subsystem is rhai). No cycle: lunco-workspace has no scripting dep.
lunco-workspace = { path = "../lunco-workspace", optional = true }

[features]
# rhai on by default — the browser-capable backend. Turn it off
# (`--no-default-features`) for a script-free build.
default = ["rhai"]
rhai = ["dep:rhai", "dep:serde_json", "dep:getrandom", "dep:lunco-api", "dep:lunco-tools", "dep:lunco-tools-rhai", "dep:lunco-workspace", "dep:lunco-hooks", "dep:lunco-hooks-rhai", "dep:lunco-controller", "dep:lunco-scripting-bridge-core", "lunco-scripting-bridge-core/workspace", "lunco-twin-journal/hooks"]
# Opt-in bridge for the GUI's render-shadow policy. This edge belongs to the
# application composition root, never to the generic scripting/runtime crate.
render-policy = ["dep:lunco-render-recovery"]
# Python enables the same language-neutral bridge package as Rhai; its Python
# binding remains a separate optional backend.
python = ["dep:pyo3", "dep:libloading", "dep:serde_json", "dep:lunco-api", "dep:lunco-scripting-bridge-core"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossbeam-channel = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rhai → ahash/const-random pull getrandom 0.3, which on wasm needs BOTH the
# `wasm_js` feature (here) and `--cfg getrandom_backend="wasm_js"` (RUSTFLAGS,
# already set by scripts/build_web.sh). Mirrors luncosim/lunco-luncosim/modelica.
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }

[package.metadata.cargo-machete]
# Feature-only browser RNG backend for Rhai's transitive rand dependency.
ignored = ["getrandom"]

[dev-dependencies]

[lints]
workspace = true
