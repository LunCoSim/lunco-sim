[package]
name = "lunco-scripting"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
lunco-command-contracts = { path = "../lunco-command-contracts", optional = true }
lunco-hooks = { path = "../lunco-hooks", optional = true }
lunco-telemetry-core = { path = "../lunco-telemetry-core" }
bevy = { workspace = true }
lunco-doc = { path = "../lunco-doc" }
# Shared per-document diagnostics store (the unified error-reporting substrate
# used by Modelica + scripting). `default-features = false` drops its egui `ui`
# feature so headless / wasm scripting builds don't pull bevy_egui→winit.
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-scripting-bridge-core = { path = "../lunco-scripting-bridge-core", optional = true }
# `ScriptOp` implements `OpPayload` (DomainKind::Script) so live script edits
# auto-record into the canonical Twin journal — same "sync by default" bridge
# Modelica/USD use. `attach_journal_recorder` (in lunco-doc-bevy) needs the trait.
lunco-twin-journal = { path = "../lunco-twin-journal" }
# Optional Python one-shot execution is exposed as a typed `#[Command]`
# (`RunPython`) by the language-neutral command module. The API discovers it by
# reflection (AppTypeRegistry) — no direct `lunco-api` dependency is needed.
lunco-core = { path = "../lunco-core", optional = true }
# Backend runtime state (network role, authority guard). Only a real script
# backend can observe or use these resources.
lunco-core-session = { path = "../lunco-core-session", optional = true }
# The Rhai tutorial bridge reads the shared resolved keymap. Optional so
# Python-only and script-free builds do not acquire the input projection.
# For the readiness policy contract declared by its owning crate.
lunco-readiness = { workspace = true, optional = true }
lunco-core-runtime = { path = "../lunco-core-runtime", optional = true }
lunco-time = { path = "../lunco-time", optional = true }
pyo3 = { version = "0.23", optional = true }
libloading = { version = "0.8", optional = true }
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
# Scenario lifecycle uses the transport-free registry and command session facts;
# the Rhai interpreter and world bridge live in the sibling runtime package.
lunco-api = { path = "../lunco-api", optional = true }

[features]
default = []
window-audience = ["bevy/bevy_window"]
rhai = [
    "dep:serde_json",
    "dep:lunco-hooks",
    "dep:lunco-api",
    "dep:lunco-command-contracts",
    "dep:lunco-core",
    "dep:lunco-core-session",
    "dep:lunco-scripting-bridge-core",
    "lunco-scripting-bridge-core/workspace",
    "dep:lunco-readiness",
    "dep:lunco-core-runtime",
    "dep:lunco-time",
]
python = [
    "dep:anyhow",
    "dep:pyo3",
    "dep:libloading",
    "dep:serde_json",
    "dep:lunco-hooks",
    "dep:lunco-api",
    "dep:lunco-command-contracts",
    "dep:lunco-core",
    "dep:lunco-core-session",
    "dep:lunco-scripting-bridge-core",
    "dep:lunco-readiness",
    "dep:lunco-core-runtime",
    "dep:lunco-time",
]

[lints]
workspace = true

[[test]]
name = "scenario_audience"
path = "tests/scenario_audience.rs"
required-features = ["rhai"]
