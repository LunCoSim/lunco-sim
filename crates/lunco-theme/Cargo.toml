[package]
name = "lunco-theme"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Core design tokens and theming system for LunCoSim"

[dependencies]
lunco-assets-runtime = { path = "../lunco-assets-runtime" }
lunco-assets-datasets = { path = "../lunco-assets-datasets" }
bevy = { workspace = true }
# Theme installs the application fallback font against egui's built-in font
# set; it does not own the workbench's picking, clipboard, or URL policy.
bevy_egui = { workspace = true, features = ["render", "default_fonts"] }
lunco-settings = { path = "../lunco-settings" }
serde = { workspace = true }

[lints]
workspace = true
