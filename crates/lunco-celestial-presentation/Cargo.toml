description = "Trajectory overlays and sampling presentation for celestial scenes"

[dependencies]
bevy = { workspace = true, features = ["bevy_mesh", "bevy_camera", "bevy_light", "bevy_picking"] }
bevy_mesh = { workspace = true }
big_space = { workspace = true }
futures-lite = { workspace = true }
lunco-celestial = { path = "../lunco-celestial" }
lunco-celestial-spatial-core = { path = "../lunco-celestial-spatial-core" }
lunco-render = { path = "../lunco-render" }
lunco-celestial-spatial = { path = "../lunco-celestial-spatial" }
lunco-spatial = { path = "../lunco-spatial" }
lunco-time = { path = "../lunco-time" }

[lints]
workspace = true

[dev-dependencies]
lunco-assets-runtime = { path = "../lunco-assets-runtime" }
