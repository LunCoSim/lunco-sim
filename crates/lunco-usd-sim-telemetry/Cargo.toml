[package]
name = "lunco-usd-sim-telemetry"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Render-free USD/Avian physics telemetry for LunCoSim"

[dependencies]
lunco-core-runtime = { path = "../lunco-core-runtime" }
avian3d = { workspace = true }
bevy = { workspace = true }
lunco-core = { path = "../lunco-core" }
lunco-mobility = { path = "../lunco-mobility" }
# Contact aggregation is a physics fact; telemetry should not depend on the
# co-simulation orchestrator merely to read Avian's contact graph.
lunco-physics = { path = "../lunco-physics" }
lunco-signal = { path = "../lunco-signal" }
lunco-telemetry = { path = "../lunco-telemetry" }
lunco-time = { path = "../lunco-time" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }

[lints]
workspace = true
