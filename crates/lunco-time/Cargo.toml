[package]
name = "lunco-time"
version = "0.6.0-dev"
edition = "2024"
license.workspace = true

[dependencies]
lunco-core-runtime = { path = "../lunco-core-runtime" }
bevy = { workspace = true }
lunco-core = { path = "../lunco-core" }
lunco-hooks = { path = "../lunco-hooks" }
