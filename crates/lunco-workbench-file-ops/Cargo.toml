[package]
name = "lunco-workbench-file-ops"
version = "0.1.0-dev"
edition = "2024"
license.workspace = true
description = "Reusable typed file and Twin workflow commands for LunCoSim workbench hosts"

[dependencies]
lunco-assets-path = { path = "../lunco-assets-path" }
lunco-command-contracts = { path = "../lunco-command-contracts" }
bevy = { workspace = true }
lunco-core = { path = "../lunco-core" }
lunco-core-session = { path = "../lunco-core-session" }
lunco-doc = { path = "../lunco-doc" }
lunco-doc-bevy = { path = "../lunco-doc-bevy" }
lunco-storage = { path = "../lunco-storage" }
lunco-twin = { path = "../lunco-twin", features = ["bevy"] }
lunco-workbench-file-dialog = { path = "../lunco-workbench-file-dialog" }
lunco-workspace = { path = "../lunco-workspace" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
