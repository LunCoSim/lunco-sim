[package]
name = "lunco-api-transport"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Native HTTP and browser transports for the LunCoSim API"

[features]
default = ["transport-http"]
transport-http = ["dep:axum", "dep:tokio"]
winit = ["bevy/bevy_winit"]

[dependencies]
lunco-api = { path = "../lunco-api" }
lunco-core = { path = "../lunco-core" }
bevy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", features = ["ws"], optional = true }
tokio = { version = "1", default-features = false, features = ["full"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["sync"] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
base64 = { workspace = true }

[lints]
workspace = true
