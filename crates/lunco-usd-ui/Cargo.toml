[package]
name = "lunco-usd-ui"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "LunCoSim's interactive USD browser and preview UI"

[dependencies]
# This package owns USD browser/lifecycle presentation, not the render
# runtime. It names Bevy asset resources directly; render, camera, lighting,
# and post-process features belong to `lunco-usd-viewport-runtime`.
bevy = { workspace = true, features = ["bevy_asset"] }
egui = { workspace = true }
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-assets-path = { path = "../lunco-assets-path" }
lunco-core-session = { path = "../lunco-core-session" }
lunco-doc = { path = "../lunco-doc" }
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-status-core = { path = "../lunco-status-core" }
lunco-storage = { path = "../lunco-storage" }
lunco-theme = { path = "../lunco-theme" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
lunco-usd-bevy-twin = { path = "../lunco-usd-bevy-twin" }
lunco-usd-core = { path = "../lunco-usd-core" }
lunco-usd-data = { path = "../lunco-usd-data" }
lunco-usd-document = { path = "../lunco-usd-document" }
lunco-usd-compose = { path = "../lunco-usd-compose" }
lunco-usd-viewport-core = { path = "../lunco-usd-viewport-core" }
lunco-workbench-state = { path = "../lunco-workbench-state" }
lunco-workbench-browser = { path = "../lunco-workbench-browser" }
lunco-workbench-core = { path = "../lunco-workbench-core" }
lunco-workbench-file-dialog = { path = "../lunco-workbench-file-dialog" }
lunco-workbench-widgets = { path = "../lunco-workbench-widgets" }
lunco-workspace = { path = "../lunco-workspace" }
openusd = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
lunco-usd-commands = { path = "../lunco-usd-commands" }
tempfile = { workspace = true }

[lints]
workspace = true
