[package]
name = "lunco-networking-sync"
version = "0.1.0-dev"
edition = "2024"
license.workspace = true
description = "Transport-neutral networking synchronization and scenario distribution"

[features]
default = []
layout-sync = ["dep:lunco-workbench-core"]

[dependencies]
avian3d = { workspace = true }
bevy = { workspace = true }
big_space = { workspace = true }
bincode = { workspace = true }
crossbeam-channel = { workspace = true }
leafwing-input-manager = { workspace = true }
lunco-api = { path = "../lunco-api" }
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-assets-transport = { path = "../lunco-assets-transport" }
lunco-embodiment-core = { path = "../lunco-embodiment-core" }
lunco-camera-core = { path = "../lunco-camera-core" }
lunco-celestial = { path = "../lunco-celestial", default-features = false }
lunco-celestial-spatial-core = { path = "../lunco-celestial-spatial-core" }
lunco-control-core = { path = "../lunco-control-core" }
lunco-core = { path = "../lunco-core" }
lunco-core-session = { path = "../lunco-core-session" }
lunco-doc = { path = "../lunco-doc" }
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-hash = { path = "../lunco-hash", features = ["cid"] }
lunco-networking-core = { path = "../lunco-networking-core" }
lunco-scripting = { path = "../lunco-scripting", default-features = false, features = ["rhai"] }
lunco-settings = { path = "../lunco-settings" }
lunco-spatial = { path = "../lunco-spatial" }
lunco-storage = { path = "../lunco-storage" }
lunco-twin = { path = "../lunco-twin" }
lunco-twin-journal = { path = "../lunco-twin-journal", features = ["hooks"] }
lunco-workbench-core = { path = "../lunco-workbench-core", optional = true }
lunco-workspace = { path = "../lunco-workspace" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
