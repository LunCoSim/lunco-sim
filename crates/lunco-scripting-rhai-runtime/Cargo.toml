[package]
name = "lunco-scripting-rhai-runtime"
version = "0.1.0-dev"
edition = "2024"
license.workspace = true
description = "Production Rhai world runtime, commands, policies, and authored source loading"

[lib]
name = "lunco_scripting_rhai_runtime"
path = "src/lib.rs"

[dependencies]
bevy = { workspace = true }
rhai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
lunco-api = { path = "../lunco-api" }
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-command-contracts = { path = "../lunco-command-contracts" }
lunco-core = { path = "../lunco-core" }
lunco-core-session = { path = "../lunco-core-session" }
lunco-doc = { path = "../lunco-doc" }
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-hash = { path = "../lunco-hash" }
lunco-hooks = { path = "../lunco-hooks" }
lunco-hooks-rhai = { path = "../lunco-hooks-rhai" }
lunco-input-core = { path = "../lunco-input-core" }
lunco-physics = { path = "../lunco-physics" }
lunco-scripting = { path = "../lunco-scripting", default-features = false, features = ["rhai"] }
lunco-scripting-bridge-core = { path = "../lunco-scripting-bridge-core" }
lunco-scripting-bridge-spatial = { path = "../lunco-scripting-bridge-spatial" }
lunco-scripting-bridge-time = { path = "../lunco-scripting-bridge-time" }
lunco-scripting-bridge-usd = { path = "../lunco-scripting-bridge-usd" }
lunco-scripting-rhai-core = { path = "../lunco-scripting-rhai-core" }
lunco-spatial = { path = "../lunco-spatial" }
lunco-storage = { path = "../lunco-storage" }
lunco-telemetry-core = { path = "../lunco-telemetry-core" }
lunco-tools = { path = "../lunco-tools" }
lunco-tools-rhai = { path = "../lunco-tools-rhai" }
lunco-twin-journal = { path = "../lunco-twin-journal" }
lunco-workspace = { path = "../lunco-workspace" }
lunco-hooks-native = { path = "../lunco-hooks-native", optional = true }

[features]
default = ["rhai"]
rhai = ["lunco-scripting/rhai"]
native-plugins = ["dep:lunco-hooks-native", "rhai"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
