[package]
name = "lunco-luncosim-server"
version = "0.6.0-dev"
edition = "2024"
license.workspace = true
description = "Headless launcher for the LunCo luncosim — the same app as `luncosim`, built without the GUI (no winit/egui) and with the API + networking host. Exists as its own crate purely so it can default to headless: Cargo default features are per-package, so a bin that's headless-by-default needs its own package."

[[bin]]
name = "luncosim-server"
path = "src/main.rs"

[dependencies]
# Link the production headless runtime directly. The GUI shell is not part of
# this dependency closure, so window/render/CLI changes do not rebuild the server.
lunco-luncosim-core = { path = "../lunco-luncosim-core", default-features = false }
lunco-luncosim-runtime = { path = "../lunco-luncosim-runtime", default-features = false, features = ["server"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "0.1"

[features]
default = ["sysml"]
sysml = ["lunco-luncosim-runtime/sysml"]

[lints]
workspace = true
