[package]
name = "lunco-render"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Shared render-look configuration for LunCoSim: lunar sun shadows, Graphics quality presets, and render-owned camera/light/terrain budgets."

[dependencies]
# `bevy_light` supplies the directional-light + cascade-shadow component types.
# It is data/components only — NOT the `bevy_pbr` render pipeline — so this crate
# stays cheap and can sit below every 3D crate without dragging in rendering.
bevy = { workspace = true, features = ["bevy_light"] }
lunco-settings = { path = "../lunco-settings" }
serde = { workspace = true }

[lints]
workspace = true
