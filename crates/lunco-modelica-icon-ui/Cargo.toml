[package]
name = "lunco-modelica-icon-ui"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Reusable egui renderer for Modelica icon and diagram graphics"

[dependencies]
bevy_egui = { workspace = true }
image = { workspace = true }
lyon_geom = "1"
lyon_path = "1"
lyon_tessellation = "1"
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-modelica-core = { path = "../lunco-modelica-core", default-features = false }
lunco-storage = { path = "../lunco-storage" }
lunco-theme = { path = "../lunco-theme" }

[lints]
workspace = true
