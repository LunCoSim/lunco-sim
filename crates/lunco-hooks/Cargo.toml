[package]
name = "lunco-hooks"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Backend-agnostic internal HOOK registry — the extension-point substrate that lets any scripting runtime (rhai now, python/wasm later) implement internal Rust decision points (merge policy, authorization, …)."

[dependencies]
# `inventory` makes owner-side `declare_hook!` invocations link into one catalog
# automatically. `serde` serializes the shared typed value in command contracts;
# neither dependency brings a runtime engine, Bevy, or scripting closure.
inventory = "0.3"
serde = { workspace = true }

[lints]
workspace = true
