[package]
name = "lunco-hooks"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Backend-agnostic internal HOOK registry — the extension-point substrate that lets any scripting runtime (rhai now, python/wasm later) implement internal Rust decision points (merge policy, authorization, …)."

[dependencies]
# `inventory` makes owner-side `declare_hook!` invocations link into one catalog
# automatically. The shared context crate uses `bevy_reflect` but no Bevy ECS
# runtime; this registry remains independent of scripting engines and worlds.
inventory = "0.3"
lunco-runtime-context = { path = "../lunco-runtime-context" }
serde = { workspace = true }

[lints]
workspace = true
