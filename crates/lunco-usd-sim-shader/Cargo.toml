[package]
name = "lunco-usd-sim-shader"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Render-free USD shader-intent projection for LunCoSim"

[dependencies]
lunco-usd-bevy-stage = { path = "../lunco-usd-bevy-stage" }
bevy = { workspace = true, features = ["bevy_asset", "bevy_mesh"] }
openusd = { workspace = true }
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-core = { path = "../lunco-core" }
lunco-port-core = { path = "../lunco-port-core" }
lunco-materials = { path = "../lunco-materials" }
lunco-render = { path = "../lunco-render" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
lunco-usd-sim-core = { path = "../lunco-usd-sim-core" }

[dev-dependencies]
lunco-usd-compose = { path = "../lunco-usd-compose" }

[lints]
workspace = true
