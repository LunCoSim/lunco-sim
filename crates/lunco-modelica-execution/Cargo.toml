[package]
name = "lunco-modelica-execution"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Modelica solver workers, experiment execution, and transport adapters"

[[bin]]
name = "lunica_worker"
path = "src/bin/lunica_worker.rs"

[[bin]]
name = "modelica_run"
path = "src/bin/modelica_run.rs"

[[bin]]
name = "modelica_tester"
path = "src/bin/modelica_tester.rs"

[dependencies]
lunco-assets-core = { path = "../lunco-assets-core" }
bevy.workspace = true
crossbeam-channel.workspace = true
lunco-core-runtime = { path = "../lunco-core-runtime" }
lunco-doc = { path = "../lunco-doc" }
lunco-experiments = { path = "../lunco-experiments" }
lunco-modelica-library = { path = "../lunco-modelica-library" }
lunco-modelica-index = { path = "../lunco-modelica-index" }
lunco-modelica-ast = { path = "../lunco-modelica-ast" }
lunco-modelica-compiler = { path = "../lunco-modelica-compiler" }
lunco-modelica-core = { path = "../lunco-modelica-core", default-features = false }
lunco-modelica-document = { path = "../lunco-modelica-document" }
lunco-modelica-runner = { path = "../lunco-modelica-runner" }
lunco-modelica-runtime = { path = "../lunco-modelica-runtime" }
lunco-modelica-telemetry = { path = "../lunco-modelica-telemetry" }
lunco-modelica-worker = { path = "../lunco-modelica-worker" }
lunco-modelica-solver = { path = "../lunco-modelica-solver" }
lunco-settings = { path = "../lunco-settings" }
lunco-time = { path = "../lunco-time" }
lunco-signal = { path = "../lunco-signal" }
rumoca-compile.workspace = true
serde.workspace = true
serde_json.workspace = true
web-time.workspace = true
bincode.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
lunco-worker-transport = { path = "../lunco-worker-transport" }
js-sys.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = [
    "console",
    "DedicatedWorkerGlobalScope",
    "MessageEvent",
    "Worker",
    "WorkerType",
    "WorkerOptions",
    "ErrorEvent",
] }
console_error_panic_hook.workspace = true

[lints]
workspace = true
