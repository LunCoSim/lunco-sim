[package]
name = "lunco-mobility"
version = "0.6.0-dev"
edition = "2021"
license.workspace = true

[dependencies]
lunco-core-runtime = { path = "../lunco-core-runtime" }
lunco-telemetry-core = { path = "../lunco-telemetry-core" }
bevy = { workspace = true }
avian3d = { workspace = true }
lunco-core = { path = "../lunco-core" }
lunco-port-core = { path = "../lunco-port-core" }
lunco-control-core = { path = "../lunco-control-core" }
lunco-spatial = { path = "../lunco-spatial" }
lunco-core-session = { path = "../lunco-core-session" }
lunco-environment = { path = "../lunco-environment" }
# `physics_is_live` — the run condition gating force application on the solver
# actually stepping. The wheel systems write into avian's force accumulator, which
# only the physics step clears; the `Time<Virtual>` gate they used to carry is open
# during a physics hold and let force pile up across a frozen shot.
lunco-physics = { path = "../lunco-physics" }
lunco-time = { path = "../lunco-time" }
# Expose physics-backed spatial queries (Raycast/GroundHeight) through the
# transport-free API query registry.
lunco-api = { path = "../lunco-api" }
lunco-api-core = { path = "../lunco-api-core" }

[lints]
workspace = true
