[package]
name = "lunco-usd-sim-cosim"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "USD co-simulation, participant readiness, and connection projection"

[features]
python = ["lunco-scripting/python", "dep:lunco-doc"]

[dependencies]
lunco-usd-bevy-stage = { path = "../lunco-usd-bevy-stage" }
lunco-core-runtime = { path = "../lunco-core-runtime" }
lunco-telemetry-core = { path = "../lunco-telemetry-core" }
avian3d = { workspace = true }
bevy = { workspace = true, features = ["bevy_asset", "bevy_mesh", "bevy_light"] }
lunco-celestial-spatial-core = { path = "../lunco-celestial-spatial-core" }
lunco-core = { path = "../lunco-core" }
lunco-port-core = { path = "../lunco-port-core" }
lunco-core-session = { path = "../lunco-core-session" }
lunco-cosim-core = { path = "../lunco-cosim-core" }
lunco-doc = { path = "../lunco-doc", optional = true }
lunco-environment = { path = "../lunco-environment" }
lunco-modelica-ast = { path = "../lunco-modelica-ast" }
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-modelica-document = { path = "../lunco-modelica-document" }
lunco-modelica-runtime = { path = "../lunco-modelica-runtime" }
lunco-physics = { path = "../lunco-physics" }
lunco-readiness = { workspace = true }
lunco-scripting = { path = "../lunco-scripting", default-features = false }
lunco-time = { path = "../lunco-time" }
lunco-usd-avian-contracts = { path = "../lunco-usd-avian-contracts" }
lunco-usd-bevy-core = { path = "../lunco-usd-bevy-core" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
lunco-usd-bevy-runtime-core = { path = "../lunco-usd-bevy-runtime-core" }
lunco-usd-sim-core = { path = "../lunco-usd-sim-core" }
lunco-usd-sim-domain = { path = "../lunco-usd-sim-domain" }
openusd = { workspace = true }

[dev-dependencies]
lunco-usd-compose = { path = "../lunco-usd-compose" }

[lints]
workspace = true
