[package]
name = "lunco-workbench-text-editor"
version = "0.1.0-dev"
edition = "2024"
license.workspace = true
description = "Reusable generic text source editor for LunCoSim workbench hosts"

[dependencies]
bevy = { workspace = true }
egui = { workspace = true }
crossbeam-channel = { workspace = true }
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-core = { path = "../lunco-core" }
lunco-doc-bevy = { path = "../lunco-doc-bevy" }
lunco-settings = { path = "../lunco-settings" }
lunco-storage = { path = "../lunco-storage" }
lunco-theme = { path = "../lunco-theme" }
lunco-workbench-core = { path = "../lunco-workbench-core" }
lunco-workbench-widgets = { path = "../lunco-workbench-widgets" }
lunco-workspace = { path = "../lunco-workspace" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }

[lints]
workspace = true
