[package]
name = "lunco-luncosim-core"
version = "0.6.0-dev"
edition = "2021"
license.workspace = true
description = "Headless-safe LunCoSim application runtime and simulation composition"

[lib]
name = "lunco_luncosim_core"
path = "src/lib.rs"

[dependencies]
lunco-telemetry-core = { path = "../lunco-telemetry-core" }
# Core owns the CPU/ECS simulation composition. Asset/image/shader stores are
# retained because USD document projection uses them as data, but renderer,
# window, glTF, mesh, and light plugins belong to the GUI edge.
bevy = { workspace = true, features = ["bevy_asset", "bevy_image", "bevy_shader"] }
avian3d = { workspace = true }
big_space = { workspace = true }
lunco-physics = { workspace = true }
lunco-core = { path = "../lunco-core" }
lunco-spatial = { path = "../lunco-spatial" }
lunco-core-session = { path = "../lunco-core-session" }
lunco-hardware = { path = "../lunco-hardware" }
lunco-telemetry = { path = "../lunco-telemetry" }
lunco-mobility = { path = "../lunco-mobility" }
lunco-controller = { path = "../lunco-controller" }
lunco-cosim-core = { path = "../lunco-cosim-core" }
lunco-input-core = { path = "../lunco-input-core" }
lunco-avatar = { path = "../lunco-avatar", default-features = false }
lunco-celestial-spatial = { path = "../lunco-celestial-spatial", default-features = false }
lunco-celestial-ephemeris = { path = "../lunco-celestial-ephemeris" }
lunco-terrain-globe = { path = "../lunco-terrain-globe" }
lunco-obstacle-field = { path = "../lunco-obstacle-field" }
lunco-terrain-surface = { path = "../lunco-terrain-surface" }
lunco-modelica-core = { path = "../lunco-modelica-core", default-features = false }
lunco-modelica-execution = { path = "../lunco-modelica-execution" }
lunco-modelica-document = { path = "../lunco-modelica-document" }
lunco-modelica-api = { path = "../lunco-modelica-api", default-features = false, optional = true }
lunco-modelica-runtime = { path = "../lunco-modelica-runtime" }
lunco-workspace-api = { path = "../lunco-workspace-api", optional = true }
lunco-sysml = { path = "../lunco-sysml", optional = true }
lunco-luncosim-exposures = { path = "../lunco-luncosim-exposures", default-features = false }
lunco-experiments = { path = "../lunco-experiments", optional = true }
serde_json = { workspace = true }
lunco-cosim = { path = "../lunco-cosim" }
lunco-usd-avian-core = { path = "../lunco-usd-avian-core" }
lunco-usd-avian-filters = { path = "../lunco-usd-avian-filters" }
lunco-environment = { path = "../lunco-environment" }
lunco-scripting = { path = "../lunco-scripting" }
lunco-scripting-rhai = { path = "../lunco-scripting-rhai" }
lunco-scripting-bridge-core = { path = "../lunco-scripting-bridge-core" }
lunco-usd-bevy-runtime = { path = "../lunco-usd-bevy-runtime", features = ["cosim"] }
lunco-usd-bevy-runtime-core = { path = "../lunco-usd-bevy-runtime-core" }
lunco-usd-bevy-core = { path = "../lunco-usd-bevy-core" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
lunco-usd-bevy-twin = { path = "../lunco-usd-bevy-twin" }
lunco-usd-core = { path = "../lunco-usd-core" }
lunco-usd-document = { path = "../lunco-usd-document" }
lunco-usd-sim-core = { path = "../lunco-usd-sim-core" }
lunco-usd-sim-domain = { path = "../lunco-usd-sim-domain" }
lunco-usd-terrain = { path = "../lunco-usd-terrain" }
lunco-scene-commands = { path = "../lunco-scene-commands" }
lunco-scene-camera = { path = "../lunco-scene-camera" }
lunco-scene-selection = { path = "../lunco-scene-selection" }
lunco-scene-authoring = { path = "../lunco-scene-authoring" }
lunco-scene-validation = { path = "../lunco-scene-validation" }
lunco-assets-datasets = { workspace = true }
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-assets-path = { path = "../lunco-assets-path" }
lunco-workspace = { path = "../lunco-workspace" }
lunco-twin = { path = "../lunco-twin" }
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-storage = { path = "../lunco-storage", optional = true }
lunco-api-transport = { path = "../lunco-api-transport", optional = true, default-features = false }
lunco-networking = { path = "../lunco-networking", optional = true, default-features = false }
lunco-networking-core = { path = "../lunco-networking-core", optional = true }
lunco-networking-sync = { path = "../lunco-networking-sync", optional = true }
lunco-twin-journal = { path = "../lunco-twin-journal", optional = true }

[features]
# SysML is an explicit application capability. Keeping it opt-in prevents the
# headless simulation substrate from compiling the document integration for
# hosts that do not install a SysML surface.
default = []
experiments = ["dep:lunco-experiments", "dep:lunco-storage"]
server = ["api-transport", "transport-http", "networking", "experiments"]
api-transport = [
    "dep:lunco-api-transport",
    "dep:lunco-modelica-api",
    "dep:lunco-workspace-api",
    "lunco-usd-bevy-runtime/api",
    "lunco-modelica-core/api",
]
transport-http = ["lunco-api-transport/transport-http", "lunco-networking?/transport-http"]
networking = [
    "dep:lunco-networking",
    "dep:lunco-networking-core",
    "dep:lunco-networking-sync",
    "lunco-networking/networking",
    "lunco-luncosim-exposures/networking",
    "api-transport",
    "dep:lunco-twin-journal",
]
net-diag = ["networking", "lunco-networking/net-diag"]
python = ["lunco-scripting/python", "lunco-usd-bevy-runtime/python"]
native-plugins = ["lunco-scripting/native-plugins"]
sysml = ["dep:lunco-sysml"]

[lints]
workspace = true
