[package]
name = "lunco-luncosim-core"
version = "0.6.0-dev"
edition = "2021"
license.workspace = true
description = "Dependency-light LunCoSim Bevy substrate"

[lib]
name = "lunco_luncosim_core"
path = "src/lib.rs"

[dependencies]
bevy = { workspace = true, features = ["bevy_asset", "bevy_image", "bevy_shader"] }
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-assets-runtime = { path = "../lunco-assets-runtime" }

[features]
default = []

[lints]
workspace = true
