[package]
name = "lunco-scene-queries"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Shared read-only scene and composed-USD query providers"

[dependencies]
lunco-usd-bevy-stage = { path = "../lunco-usd-bevy-stage" }
# Queries are a production API surface shared by Rhai, HTTP, MCP, and headless
# hosts. Keep them independent from the much larger scene command handlers so
# read-side changes do not rebuild the mutation layer.
avian3d = { workspace = true }
bevy = { workspace = true, features = ["bevy_asset"] }
lunco-api = { path = "../lunco-api" }
lunco-core = { path = "../lunco-core" }
lunco-celestial = { path = "../lunco-celestial", default-features = false }
lunco-control-core = { path = "../lunco-control-core" }
lunco-doc = { path = "../lunco-doc" }
lunco-doc-bevy = { path = "../lunco-doc-bevy", default-features = false }
lunco-physics = { path = "../lunco-physics" }
lunco-scene-catalog = { path = "../lunco-scene-catalog" }
lunco-usd-avian-contracts = { path = "../lunco-usd-avian-contracts" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
lunco-usd-bevy-twin = { path = "../lunco-usd-bevy-twin" }
lunco-usd-authoring = { path = "../lunco-usd-authoring" }
lunco-usd-document = { path = "../lunco-usd-document" }
openusd = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
