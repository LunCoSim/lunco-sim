[package]
name = "lunco-controller"
version = "0.6.0-dev"
edition = "2021"
license.workspace = true

[dependencies]
lunco-core-runtime = { path = "../lunco-core-runtime" }
lunco-command-contracts = { path = "../lunco-command-contracts" }
lunco-telemetry-core = { path = "../lunco-telemetry-core" }
bevy = { workspace = true }
leafwing-input-manager = { workspace = true }
lunco-core = { path = "../lunco-core" }
lunco-port-core = { path = "../lunco-port-core" }
lunco-control-core = { path = "../lunco-control-core" }
lunco-core-session = { path = "../lunco-core-session" }
lunco-input-core = { path = "../lunco-input-core" }
# The generic vessel-control command contracts live in the backend-neutral
# package; `drive_from_bindings` triggers them from held keys.
lunco-cosim-core = { path = "../lunco-cosim-core" }
# The interaction cadence (`InteractionSchedule`): the constant-rate, never-paused
# step the free avatar's self-drive runs on, so pausing the sim doesn't freeze the
# user's own movement.
lunco-time = { path = "../lunco-time" }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# The controller's integration tests install the real co-simulation plugin;
# production controller users need only the command contracts above.
lunco-cosim = { path = "../lunco-cosim" }
