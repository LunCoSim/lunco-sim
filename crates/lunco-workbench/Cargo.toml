[package]
name = "lunco-workbench"
version = "0.1.0-dev"
edition = "2021"
license.workspace = true
description = "LunCoSim's own workbench shell — activity bar, central viewport, right inspector, bottom dock, status bar. Native replacement for bevy_workbench."

[features]
default = []
# Workspace-query and screenshot capabilities. The screenshot implementation is
# supplied by `lunco-capture`; the shell only installs it when its API surface is
# enabled by a rendered host.
api = [
    "dep:lunco-capture",
    "lunco-capture/api",
    "dep:lunco-workspace-api",
] # `web-time` is already an unconditional dep

[dependencies]
# `bevy_render` facade feature: the workbench's viewport and graphics menu
# `bevy::render::{RenderApp, RenderDevice, WgpuSettings, RenderStartup}`
# directly. The workspace baseline is render-free; this crate genuinely
# needs the render facade (it installs the wgpu error handler), so it
# opts in here per the documented pattern (render crates pull bevy_render
# via their own feature list). Without it `cargo check -p lunco-workbench`
# fails to resolve `bevy::render` even though full binaries enable it
# transitively.
# `bevy_pbr` owns the renderer's directional-light/cascade shader limits. The
# workbench validates persisted shadow settings against those authoritative
# limits before it can reach the render world; it does not reimplement them.
bevy = { workspace = true, features = ["bevy_render", "bevy_light", "bevy_pbr"] }
bevy_egui = { workspace = true }
leafwing-input-manager = { workspace = true }
lunco-workbench-core = { path = "../lunco-workbench-core" }
lunco-workbench-widgets = { path = "../lunco-workbench-widgets" }
lunco-workbench-file-ops = { path = "../lunco-workbench-file-ops" }
lunco-workbench-text-editor = { path = "../lunco-workbench-text-editor" }
lunco-status-core = { path = "../lunco-status-core" }
# Screenshot commands and GPU readback live in the production capture capability;
# keeping this dependency optional preserves the shell-only build.
lunco-capture = { path = "../lunco-capture", optional = true }
# Needed only to name `wgpu::Error` in the uncaptured-error handler
lunco-theme = { path = "../lunco-theme" }
# `serde` feature lets us persist `DockState<TabId>` for per-Twin layout
# restore (Phase 5). `TabId`/`PanelId` carry their own serde impls
# (see `panel.rs` — `PanelId` interns on deserialize).
egui_dock = { version = "0.20", features = ["serde"] }
# `Command` / `on_command` / `register_commands!` macros (re-exports
# from `lunco-command-macro`). Brings shell picker/workflow verbs onto the
# same typed-command bus that domain crates already use.
lunco-core = { path = "../lunco-core" }
lunco-core-session = { path = "../lunco-core-session" }
lunco-render-recovery = { path = "../lunco-render-recovery" }
# The overlay is a view of the controller's authored keymap; it must not keep a
# second list of keyboard labels that drifts when keybindings.json changes.
lunco-controller = { path = "../lunco-controller" }
lunco-time = { path = "../lunco-time" }
lunco-doc = { path = "../lunco-doc" }
# `SaveDocument` / `SaveAsDocument` / `CloseDocument` Command structs +
# `EditorIntent` rebindable verbs.
lunco-doc-bevy = { path = "../lunco-doc-bevy" }
lunco-twin = { path = "../lunco-twin", features = ["bevy"] }
lunco-workspace = { path = "../lunco-workspace" }
lunco-workspace-api = { path = "../lunco-workspace-api", optional = true }
# Storage remains the workbench's document/session I/O boundary; the separate
# picker capability owns dialog descriptors and native/wasm dialog backends.
lunco-storage = { path = "../lunco-storage" }
# Used for the recents-changed fingerprint in `WorkspacePlugin` —
# stable serialisation lets us skip writes when nothing changed.
serde_json = { workspace = true }
serde = { workspace = true }
lunco-settings = { path = "../lunco-settings" }
lunco-render = { path = "../lunco-render" }
[lints]
workspace = true
