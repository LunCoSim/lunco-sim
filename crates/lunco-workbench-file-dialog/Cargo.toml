[package]
name = "lunco-workbench-file-dialog"
version = "0.1.0-dev"
edition = "2024"
license.workspace = true
description = "Native and wasm file-dialog capability for LunCoSim workbench hosts"

[dependencies]
bevy = { workspace = true }
lunco-doc = { path = "../lunco-doc" }
lunco-storage = { path = "../lunco-storage" }
rfd = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlAnchorElement",
    "CssStyleDeclaration",
    "Node",
    "File",
    "FileList",
    "Blob",
    "Url",
] }

[lints]
workspace = true
