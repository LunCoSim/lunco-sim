[package]
name = "lunco-hooks-rhai"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Rhai binding for the runtime-agnostic lunco-hooks registry: implements ScriptHook once for Rhai so a function can fill any internal hook point. Uses no Bevy ECS or world runtime."

[dependencies]
lunco-hooks = { path = "../lunco-hooks" }
# `sync` feature (workspace-pinned) makes rhai's Engine/Dynamic Send+Sync, so a
# RhaiHook can live in the global registry behind `Arc<dyn ScriptHook>`.
rhai = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
