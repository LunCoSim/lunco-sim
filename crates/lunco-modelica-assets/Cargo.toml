[package]
name = "lunco-modelica-assets"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Native Modelica asset packaging tools for LunCoSim"

[[bin]]
name = "build_modelica_library_assets"
path = "src/bin/build_modelica_library_assets.rs"

[[bin]]
name = "modelica_library_indexer"
path = "src/bin/modelica_library_indexer.rs"

[[bin]]
name = "modelica_library_parse_bench"
path = "src/bin/modelica_library_parse_bench.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# This package is a native asset/tool boundary. Its wasm target keeps an empty
# library/bin surface, so the archive/indexer toolchain stays out of web builds.
lunco-assets-core = { path = "../lunco-assets-core" }
lunco-assets-path = { path = "../lunco-assets-path" }
lunco-assets-runtime = { path = "../lunco-assets-runtime" }
lunco-modelica-compiler = { path = "../lunco-modelica-compiler" }
lunco-modelica-core = { path = "../lunco-modelica-core" }
lunco-modelica-library = { path = "../lunco-modelica-library" }
lunco-modelica-index = { path = "../lunco-modelica-index" }
lunco-modelica-ast = { path = "../lunco-modelica-ast" }
log = "0.4"
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }
rayon = { workspace = true }
regex = "1.10"
rumoca-compile = { workspace = true }
rumoca-phase-parse = { workspace = true }
rumoca-ir-ast = { workspace = true }
bincode = { workspace = true }
ruzstd = "0.7"
web-time = { workspace = true }

[lints]
workspace = true
