[package]
name = "lunco-render-recovery"
version = "0.1.0-dev"
edition = "2021"
license.workspace = true
description = "Render-device health, adapter capability admission, and presentation recovery for LunCoSim"

[dependencies]
bevy = { workspace = true, features = ["bevy_render", "bevy_light", "bevy_pbr"] }
bevy_egui = { workspace = true, features = ["render"] }
lunco-core = { path = "../lunco-core" }
lunco-hooks = { path = "../lunco-hooks" }
lunco-render = { path = "../lunco-render" }
lunco-settings = { path = "../lunco-settings" }
lunco-status-core = { path = "../lunco-status-core" }
lunco-theme = { path = "../lunco-theme" }
wgpu = { version = "29", default-features = false }

[lints]
workspace = true
