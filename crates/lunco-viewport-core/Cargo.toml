[package]
name = "lunco-viewport-core"
version = "0.1.0-dev"
edition = "2024"
license.workspace = true
description = "Renderer-independent measured viewport geometry"

[dependencies]
# `Camera` and `Ray3d` are part of Bevy's camera facade; declare that feature
# here instead of relying on a render/UI consumer to unify it transitively.
bevy = { workspace = true, features = ["bevy_camera"] }

[lints]
workspace = true
