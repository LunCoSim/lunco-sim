[package]
name = "lunco-avatar"
version = "0.6.0-dev"
edition = "2021"
license.workspace = true

[dependencies]
lunco-command-contracts = { path = "../lunco-command-contracts" }
lunco-telemetry-core = { path = "../lunco-telemetry-core" }
# RENDER-FREE. `bevy_camera` gives `Camera` / `Projection` / `Visibility` /
# `RenderLayers`, `bevy_light` the lights, `bevy_mesh` `Mesh3d` — none of them pulls
# `bevy_render`. There is no `bevy_pbr` / `bevy_core_pipeline` here and there must
# not be: the camera *pipeline* (`Camera3d`, tonemapping, MSAA, bloom) is attached by
# `lunco-render-bevy` from the `lunco_render::SceneCamera` intent projected from USD.
#
# Render-bound screenshots and offline recording live in `lunco-capture`; keeping them out
# preserves this crate's render-free camera/interaction dependency boundary.
bevy = { workspace = true, features = ["bevy_camera", "bevy_light", "bevy_mesh"] }
# Camera INTENT: `SceneCamera` — "this entity is the scene camera, and this is how it
# should look" — stated without naming a render pipeline.
lunco-render = { path = "../lunco-render" }
lunco-notifications-core = { path = "../lunco-notifications-core" }
leafwing-input-manager = { workspace = true }
lunco-interaction-core = { path = "../lunco-interaction-core" }
lunco-input-core = { path = "../lunco-input-core" }
lunco-embodiment-core = { path = "../lunco-embodiment-core" }
lunco-avatar-camera-core = { path = "../lunco-avatar-camera-core" }
lunco-camera-core = { path = "../lunco-camera-core" }
lunco-viewport-core = { path = "../lunco-viewport-core" }
lunco-cosim-core = { path = "../lunco-cosim-core" }
lunco-core = { path = "../lunco-core" }
lunco-port-core = { path = "../lunco-port-core" }
lunco-control-core = { path = "../lunco-control-core" }
lunco-spatial = { path = "../lunco-spatial" }
lunco-core-session = { path = "../lunco-core-session" }
lunco-time = { path = "../lunco-time" }
lunco-settings = { path = "../lunco-settings" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }

[lints]
workspace = true
