[package]
name = "lunco-usd-sim"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
# RENDER-FREE by construction (docs/architecture/render-decoupling.md): NO
# `bevy_pbr` / `bevy_core_pipeline` / `bevy_post_process` / `bevy_anti_alias`.
# This crate states appearance + camera INTENT (`lunco_render::{PbrLook,
# SceneCamera}`, `lunco_materials::ShaderLook`); `lunco-render-bevy` binds it.
# NO `mesh_picking` — see `lunco-usd-bevy`. This crate does no hit-testing.
bevy = { workspace = true, features = ["bevy_asset", "bevy_mesh", "bevy_light"] }
openusd = { workspace = true }
lunco-usd-bevy-core = { path = "../lunco-usd-bevy-core" }
lunco-usd-bevy-light = { path = "../lunco-usd-bevy-light" }
lunco-usd-bevy-scene = { path = "../lunco-usd-bevy-scene" }
lunco-usd-sim-celestial = { path = "../lunco-usd-sim-celestial" }
lunco-usd-sim-shader = { path = "../lunco-usd-sim-shader" }
lunco-usd-sim-telemetry = { path = "../lunco-usd-sim-telemetry" }
lunco-usd-avian-joints = { path = "../lunco-usd-avian-joints" }
lunco-usd-avian-contracts = { path = "../lunco-usd-avian-contracts" }
lunco-usd-avian-reader = { path = "../lunco-usd-avian-reader" }
lunco-usd-avian-filters = { path = "../lunco-usd-avian-filters" }
lunco-usd-actuation = { path = "../lunco-usd-actuation" }
lunco-usd-sim-core = { path = "../lunco-usd-sim-core" }
lunco-usd-sim-authoring = { path = "../lunco-usd-sim-authoring" }
# `ShaderLook` + `ParamValue` (the open, WGSL-reflected parameter set).
# `lunco-materials` is render-free: `shader_material.rs` (the `AsBindGroup` that
# pulled `bevy_pbr`) moved to `lunco-render-bevy` on 2026-07-13, so this crate's
# dep GRAPH no longer reaches wgpu either. Keep it that way.
lunco-materials = { path = "../lunco-materials" }
lunco-render = { path = "../lunco-render" }
lunco-mobility = { path = "../lunco-mobility" }
lunco-core = { path = "../lunco-core" }
lunco-port-core = { path = "../lunco-port-core" }
lunco-spatial = { path = "../lunco-spatial" }
lunco-core-session = { path = "../lunco-core-session" }
lunco-interaction-core = { path = "../lunco-interaction-core" }
lunco-environment = { path = "../lunco-environment" }
# Typed avatar lifecycle and role handoff only. Camera behavior and all raw
# input translation belong to `lunco-avatar` and the authored Rhai layer.
lunco-embodiment-core = { path = "../lunco-embodiment-core" }
lunco-cosim-core = { path = "../lunco-cosim-core" }
# Declares what a loading scene is still waiting on — see `src/readiness.rs`.
lunco-physics = { path = "../lunco-physics" }
avian3d = { workspace = true }
big_space = { workspace = true }
web-time = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
lunco-usd-avian = { path = "../lunco-usd-avian" }
lunco-usd-compose = { path = "../lunco-usd-compose" }
