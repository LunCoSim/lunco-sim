# Bare `cargo build`/`check`/`test` (no `-p`/`--workspace`) operates on just the
# two app crates and their dependency closure. This skips workspace members that
# no binary reaches — the feature-gated lunco-networking — so default builds don't
# compile dead weight. Use `--workspace` to include everything (e.g. CI lint/test
# sweeps). `lunco-telemetry` is wired into `lunco-luncosim`, including the
# `SubscribeTelemetry` command path.
#
# `lunco-luncosim-server`, `lunco-luncosim-core`, and
# `lunco-luncosim-runtime` are intentionally NOT here: the server is a
# separately selected headless app and those packages are dependencies of that
# app, not default desktop members. `cargo run
# -p lunco-luncosim-server`.
default-members = [
    "crates/lunco-luncosim",
    "crates/lunco-modelica-ui",
]
resolver = "2"
exclude = ["third_party/bevy_solari"]

[workspace.package]
description = "Initialize multi-crate workspace architecture for vessel control simulation"
# Matches the Apache-2.0 text in ./LICENSE. Declared here so every member inherits
# it: cargo emits no licence metadata without this field, so the published form of
# any crate in this workspace would otherwise carry no licence at all — which reads
# as "all rights reserved" regardless of what the repository root says.
license = "Apache-2.0"

[workspace.dependencies]
faer = { version = "0.24.4", default-features = false, features = ["std", "linalg"] }
kurbo = "0.13.1"
# Keep all astronomy consumers on one reviewed fork revision. Its workspace
# pins the fixed `celestial-eop-data` build dependency.
celestial-core = { git = "https://github.com/LunCoSim/celestial", rev = "c4c6f171833c70c1f369e9d65c7042ccc5cf58b8" }
celestial-ephemeris = { git = "https://github.com/LunCoSim/celestial", rev = "c4c6f171833c70c1f369e9d65c7042ccc5cf58b8" }
celestial-time = { git = "https://github.com/LunCoSim/celestial", rev = "c4c6f171833c70c1f369e9d65c7042ccc5cf58b8" }
# Slim Bevy: drop everything Modelica/rover workbench provably doesn't
# use. Defaults pull bevy_audio/vorbis (no audio in the apps),
# bevy_text/bevy_ui*/bevy_sprite* (egui replaces UI + 2D),
# bevy_animation/bevy_gizmos/bevy_gilrs/sysinfo_plugin (unused on
# either binary). Each enabled feature is documented inline so we
# don't drift.
#
# If a build break surfaces something that was silently relying on a
# default-on feature, add it here with a `# used by …` comment rather
# than re-enabling `default` (which un-strips the lot).
bevy = { version = "0.20.0", default-features = false, features = [
    # ── 2D / UI-only core. Anything 3D-shaped (PBR, GLTF, scenes,
    # meshes, post-processing, mesh picking) is *not* in this list —
    # crates that need 3D opt in via their own Cargo.toml so the
    # Lunica (LunCoSim Modelica Workbench) web binary doesn't carry them. See
    # `crates/lunco-luncosim/Cargo.toml` for the opt-in pattern.
    # SUBSTRATE ONLY (ECS / app / log / color — no GPU, window, winit, egui,
    # state, or input-focus plugins). This baseline reaches every
    # `bevy = { workspace = true }` crate, so
    # render-free crates (lunco-core, lunco-cosim, lunco-networking, …) and the
    # `--no-ui` server binary do NOT transitively link bevy_render / bevy_winit /
    # wayland. Render/window/winit are opted into by the consumer:
    #   - render crates add `features = ["bevy_pbr", …]` (pulls bevy_render);
    #   - bevy_egui pulls bevy_render + bevy_window itself, so egui crates self-heal;
    #   - GUI BINARIES add the windowing backend (bevy_winit/wayland/x11/bevy_window)
    #     via their own bevy feature list.
    "bevy_log",                    # info!/warn!/error! macros workspace-wide
    "bevy_color",                  # Color / ClearColor (ECS-level, no GPU)
    "multi_threaded",              # task pools (AsyncCompute/Io)
    # NOTE: `trace_tracy` is intentionally NOT in the workspace default features
    # because tracy-client-sys requires a C++ compile that doesn't work
    # targeting wasm32-unknown-unknown *or* Windows MSVC 2019. It is re-enabled
    # on native via the opt-in `tracy` feature on `lunco-modelica-ui`
    # (see that crate's [features] section and target-cfg dependency).
    "serialize",                   # serde Serialize/Deserialize for Entity, Vec3, Quat, Handle, etc.
                                   # Enables `#[Command]` to always derive serde without per-field worry.
] }
# ECS-only substrate for small protocol crates that do not need the Bevy facade.
bevy_ecs = { version = "0.20.0", default-features = false, features = ["std"] }
lunco-assets = { path = "crates/lunco-assets" }
lunco-assets-datasets = { path = "crates/lunco-assets-datasets" }
lunco-assets-transport = { path = "crates/lunco-assets-transport" }
lunco-assets-download = { path = "crates/lunco-assets-download" }
lunco-assets-processing = { path = "crates/lunco-assets-processing" }
sysmlv2-semantics = "=0.1.1"
sysmlv2-syntax = "=0.1.2"
sysmlv2-stdlib = "=0.1.0"
# NOTE: `debug-plugin` is deliberately OFF. It pulls bevy_gizmos → bevy_render →
# wgpu/naga/x11rb into every consumer, including the `--no-ui` server and the
# wasm worker — the same feature-unification trap as A1. Nothing in the tree
# constructs `PhysicsDebugPlugin` or `PhysicsGizmos`; re-enable it here (and only
# here) if collider debug-draw is ever wired up.
# Stable contact-subdetector ordering is part of same-build scene replay.
# Use the maintained feature for ordered Parry caches and deterministic math.
avian3d = { version = "0.8.0", default-features = false, features = ["3d", "f64", "parry-f64", "parallel", "default-collider", "collider-from-mesh", "bevy_diagnostic", "xpbd_joints", "enhanced-determinism"] }
# Bevy 0.20 support with native mixed-child transform propagation fixed.
big_space = { git = "https://github.com/LunCoSim/big_space", rev = "581295f909ddddad138a876b497dbc1fdff389b6" }
leafwing-input-manager = "0.22.0"
# bevy_egui 0.43 uses egui 0.36. The whole egui ecosystem must
# agree on the egui minor or it dual-links. Keep the workspace integration
# baseline to rendering; the concrete workbench host opts into picking,
# Bevy-UI ordering, clipboard, external links, and default fonts where those
# behaviors are actually owned.
bevy_egui = { version = "0.43.1", default-features = false, features = ["serde"] }
# UI component crates that only exchange egui values should not depend on the
# Bevy integration. Bevy hosts opt into `bevy_egui` separately.
egui = "0.36"
# Runtime-authored View HUD templates. Both target Bevy 0.20; they are optional
# so the headless luncosim server does not link Bevy UI/text presentation.
bevy_hui = "0.8"
bevy_flair = "0.9.0"
# The Bevy integration owns viewport-aware handle rendering and picking.
transform-gizmo-bevy = { version = "0.9.0", default-features = false, features = ["gizmo_picking_backend"] }
chrono = "0.4.45"
num_cpus = "1.17"
futures-lite = "2.6"
resvg = "0.47"
usvg = { version = "0.47", default-features = false }
# default-features off keeps the Lunica wasm worker lean (image's defaults
# pull ~a dozen codecs); we ship only what consumers declare — png (screenshot
# encode + MSL icons), jpeg (MSL icons), tiff. Add a feature here if a build
# surfaces a missing codec rather than re-enabling `default`.
image = { version = "0.25", default-features = false, features = ["tiff", "png", "jpeg"] }
# Pure-Rust GLB normalization for the offline asset processor. Keep only the
# decoder and raw writer; compression is not part of the ingestion contract.
draco-gltf = { version = "=0.4.0", default-features = false, features = ["write", "draco-decode"] }
# Pure-Rust TIFF container I/O (weezl/flate2 — wasm-safe). The asset processor
# ENCODES float32 heightmaps that the terrain baker and the geotiff tag layer
# DECODE; one workspace pin is what keeps writer and readers on the same wire
# format used by the terrain baker and geotiff tag layer.
tiff = "0.11"
smallvec = "1.13"
# Native Rust USD composition and generated standard-schema views.
# Exact versions keep the pre-1.0 core and schema APIs aligned.
openusd = "=0.8.0"
openusd-schemas = { version = "=0.8.0", features = ["physics", "geom", "shade", "lux"] }
truck-geometry = "0.5.0"
# The version and the feature set SHARED by both wire targets. `lunco-networking`
# builds lightyear twice — a native client+server block and a wasm client-only one
# — and holding the version in two places meant a bump could land on one target
# and not the other, which surfaces as a wire mismatch rather than a build error.
# Target-specific extras (`server`, `webtransport_dangerous_configuration`) stay in
# the native block: cargo unions features per target, so listing them here would
# hand the browser build a server it must not have.
#
# `replication` is mandatory — lightyear's lib unconditionally `use`s
# `lightyear_replication`. 0.27 split these out of an implicit bundle into
# standalone features (they sit in lightyear's `default`, which we disable), and we
# replicate snapshots + client-predict, so prediction/interpolation are needed too.
lightyear = { version = "0.31.0", default-features = false, features = [
  "client",
  "replication",
  "prediction",
  "interpolation",
  "netcode",
  "webtransport",
  "webtransport_self_signed",
] }
# Drop-in replacement for `std::time::Instant` / `SystemTime` that works on
# wasm32-unknown-unknown (where the std types panic at runtime). Backed by
# `performance.now()` in the browser, `std::time` on native. Used by Bevy
# itself, so already in our dep graph as a transitive — pin it explicitly so
# our own code can depend on it.
web-time = { version = "1", features = ["serde"] }
# getrandom 0.2 with js feature for wasm32 support (needed by rand, uuid, etc.)
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
lunco-api = { path = "crates/lunco-api" }
lunco-terrain-globe = { path = "crates/lunco-terrain-globe" }
lunco-terrain-core = { path = "crates/lunco-terrain-core" }
lunco-physics = { path = "crates/lunco-physics" }
lunco-readiness = { path = "crates/lunco-readiness" }
lunco-lint = { path = "crates/lunco-lint" }
lunco-cosim = { path = "crates/lunco-cosim" }
lunco-environment = { path = "crates/lunco-environment" }
lunco-theme = { path = "crates/lunco-theme" }
lunco-web = { path = "crates/lunco-web" }

# Rumoca 0.10.2 with shared native ME admission and checked source discovery.
# Keep one exact revision for all consumers.
rumoca-core        = { git = "https://github.com/LunCoSim/rumoca", rev = "d47a5bf3e1f970bd1315507d914d7b3464de6842" }
rumoca-ir-ast      = { git = "https://github.com/LunCoSim/rumoca", rev = "d47a5bf3e1f970bd1315507d914d7b3464de6842" }
rumoca-ir-dae = { git = "https://github.com/LunCoSim/rumoca", rev = "d47a5bf3e1f970bd1315507d914d7b3464de6842" }
rumoca-ir-solve    = { git = "https://github.com/LunCoSim/rumoca", rev = "d47a5bf3e1f970bd1315507d914d7b3464de6842" }
rumoca-phase-parse = { git = "https://github.com/LunCoSim/rumoca", rev = "d47a5bf3e1f970bd1315507d914d7b3464de6842" }
rumoca-compile     = { git = "https://github.com/LunCoSim/rumoca", rev = "d47a5bf3e1f970bd1315507d914d7b3464de6842" }
rumoca-sim         = { git = "https://github.com/LunCoSim/rumoca", rev = "d47a5bf3e1f970bd1315507d914d7b3464de6842" }
# Structural diagnostics need rumoca-sim's analysis API but not its native solver backends.
rumoca-solver      = { git = "https://github.com/LunCoSim/rumoca", rev = "d47a5bf3e1f970bd1315507d914d7b3464de6842" }
rumoca-eval-solve  = { git = "https://github.com/LunCoSim/rumoca", rev = "d47a5bf3e1f970bd1315507d914d7b3464de6842" }
rumoca-tool-fmt    = { git = "https://github.com/LunCoSim/rumoca", rev = "d47a5bf3e1f970bd1315507d914d7b3464de6842" }
rumoca-tool-lint   = { git = "https://github.com/LunCoSim/rumoca", rev = "d47a5bf3e1f970bd1315507d914d7b3464de6842" }

# Centralised here so version drift across crates is visible in one
# place. Each crate opts in via `dep = { workspace = true }`.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5.8"
percent-encoding = "2.3.2"
anyhow = "1.0"
# Pure-Rust embedded scripting engine. Chosen over Luau/mlua because mlua only
# reaches wasm via `wasm32-unknown-emscripten`; rhai compiles cleanly to
# `wasm32-unknown-unknown` (our wasm-bindgen target) with no C/C++ toolchain.
# Sandboxed (op/depth/size caps) and deterministic — fits the FixedUpdate sync
# path used by cosim + networking.
rhai = { version = "1", features = ["sync", "serde"] }
toml = "1.1"
uuid = { version = "1", features = ["v4", "serde"] }
indexmap = { version = "2.14", features = ["serde"] }
smol_str = { version = "0.3", features = ["serde"] }
crossbeam-channel = "0.5"
# Link-time distributed registry (life-before-main collection). Backs the
# asset-scheme registry: any crate `inventory::submit!`s its `AssetSchemeProvider`
# and the pre-AssetPlugin registrar drains them — no central hardcoded scheme
# list. wasm-safe (collected via wasm-bindgen module init).
inventory = "0.3"
egui_plot = "0.37.0"
rfd = "0.17"
tempfile = "3.27"
thiserror = "2.0"
async-trait = "0.1"
# Seeded, reproducible RNG for procedural generation. ChaCha8Rng seeded via
# `seed_from_u64` is deterministic across platforms and needs NO getrandom at
# runtime — so the obstacle-field generator produces identical fields on
# server + every client (networking replicates the spec, not the geometry) and
# is wasm-safe without an entropy backend.
rand = { version = "0.10", default-features = false, features = ["std"] }
rand_chacha = "0.10"

# ── wasm / browser-platform bindings ─────────────────────────────────
# Centralised so the wasm-bindgen/js-sys/web-sys family can't drift apart
# across the ~10 crates that touch the browser. web-sys features are
# additive: each crate opts into the JS APIs it needs via
# `web-sys = { workspace = true, features = ["…"] }`; Cargo unions them.
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1"

# ── Misc shared third-party (centralised to kill version drift) ──────
# Keep the shared HTTP client lean. HTTPS and response compression are enabled
# only by the asset/update consumers that need them; local API clients opt into
# TLS through their own feature.
ureq = { version = "3", default-features = false }
# NB: bincode 3.0.0 on crates.io is a non-functional troll release
# (`compile_error!("https://xkcd.com/2347/")`); 2.x is the real latest. The
# The `serde` feature exposes `bincode::serde::{encode_to_vec,decode_from_slice}`
# with `config::standard()`.
bincode = { version = "2", features = ["serde"] }
tar = "0.4"
zstd = "0.13"
rayon = "1"
linked-hash-map = "0.5.6"
base64 = "0.22"
# Pure-Rust SHA-256 — works on native AND wasm32-unknown-unknown (no
# getrandom / no C). Used by lunco-assets (asset verify) and
# lunco-networking-sync (scenario manifest revision digest; asset content
# addressing itself is shared through lunco-hash on both server and web client).
sha2 = "0.11"
# IPLD content-addressing (IPFS interop). `cid` builds/renders CIDs;
# `multihash-codetable` provides `Code::Sha2_256.digest(bytes)`. Both
# pure-Rust and wasm32-safe — the web client verifies asset hashes
# identically to native and the CIDs it pins are resolvable by `ipfs
# get`/`ipfs pin`. Wire form is canonical CID bytes (see
# lunco-networking-sync/src/scenario.rs).
cid = { version = "0.11", default-features = false, features = ["alloc", "serde"] }
multihash-codetable = { version = "0.2", default-features = false, features = ["sha2"] }

# ── Bevy sub-crates — pinned to the exact `bevy` version above ────────
# These ship in lock-step with bevy; a skewed release (e.g. bevy_reflect
# "0.20" resolving ahead of the workspace Bevy pin) risks subtle ABI/derive
# breakage. Keep every entry == the `bevy` pin.
bevy_reflect = "0.20.0"
bevy_math = "0.20.0"
bevy_mesh = "0.20.0"
bevy_shader = "0.20.0"
wesl = { version = "0.6.0", features = ["naga-ext"] }
bevy_asset = "0.20.0"
bevy_picking = "0.20.0"

# ── Lints (inherited via `[lints] workspace = true` per crate) ───────
# Encodes policy decisions:
# - Default `unused`/`dead_code` lints stay at warn (compiler default)
#   — we keep the workspace clean of them.
# - `unreachable_pub` and `missing_docs` raised to warn — both currently
#   at zero across the workspace; surfaces drift early.
# - Selected clippy lints we've already cleaned to zero are pinned at
#   warn so future code re-introducing them gets flagged.
# - `needless_pass_by_value` is silenced because Bevy SystemParams
#   (Res, Query, Commands, On, …) are framework-mandated by-value and
#   trip the lint en masse with no actionable signal. Audit on demand
#   with a grep filter; see prior session notes.
[workspace.lints.rust]
unreachable_pub = "warn"
# `missing_docs` stays at the compiler default (allow) workspace-wide;
# crates that want strict doc coverage opt in with `#![warn(missing_docs)]`
# in their `lib.rs` (currently: lunco-doc, lunco-doc-bevy, lunco-workbench,
# lunco-workspace, lunco-storage, lunco-twin). Forcing it on every crate
# would surface 1500+ warnings on the long-tail crates without value.
missing_docs = "allow"

[workspace.lints.clippy]
redundant_clone = "warn"
clone_on_copy = "warn"
or_fun_call = "warn"
needless_collect = "warn"
unnecessary_wraps = "warn"
needless_borrow = "warn"
manual_map = "warn"
manual_unwrap_or = "warn"
useless_conversion = "warn"
redundant_closure = "warn"
needless_pass_by_value = "allow"
# Bevy system signatures are inherently complex TYPES, and the complexity is
# load-bearing documentation. `Query<(Entity, &ChildOf, Option<&Name>),
# (Added<CellCoord>, Without<Grid>)>` states the system's whole contract —
# what it reads, and precisely which entities it runs for. The lint's remedy
# is a type alias, which moves that contract somewhere the reader is not
# looking and leaves the signature saying nothing. Bevy's own CI allows this
# lint for the same reason; there is no version of "fixing" these ~19 sites
# that leaves the code more readable than it is now.
#
# This is an ALLOW, not a deferral: these are not debt to pay down later.
type_complexity = "allow"
# Same reasoning, different shape. A Bevy system or observer's parameters are
# INJECTED by the scheduler, not passed by a caller — `api_request_observer`'s
# 11 "arguments" are the resources and queries it declares it needs, and no
# human ever writes that call. The lint's remedy (bundle them into a struct)
# means inventing a `SystemParam` aggregate purely to reduce a number, which
# adds indirection and hides the access set the scheduler uses for parallelism
# and conflict detection. Grouping params is worth doing when it expresses a
# real concept — never to satisfy an arity threshold meant for ordinary fns.
too_many_arguments = "allow"
# Asset I/O policy AND the GridAnchor atomic-re-parenting invariant.
# Domain crates may not bypass `AssetServer` with raw `std::fs` /
# `std::thread` / blocking `Instant` (those break wasm32 — the bug only
# shows in the browser, not in `cargo test`), and re-parenting of
# big_space `GridAnchor` entities must go through
# `lunco_core::attach::migrate_to_grid`. The full list of banned symbols
# (plus the local `#[allow]` escape-hatch policy) lives in `clippy.toml`
# at the workspace root. See `docs/architecture/40-asset-io.md` and
# `crates/lunco-core/src/attach.rs` for the rationale.
disallowed_methods = "deny"

# ── Dev profile ──────────────────────────────────────────────────────
# Bevy/avian/parry are unusably slow at opt-level 0. opt-level=1 on our
# own crates + opt-level=3 on deps recovers most of release-mode runtime
# speed for a one-time longer dep build (cached afterwards).
#
# debug + split-debuginfo: the default `debug = true` (full DWARF, level 2)
# is what makes native `target/debug` explode to 40G+ on a Bevy/avian stack
# (31G of it is deps rlibs; example binaries carry 2-4G of embedded debuginfo
# each). `line-tables-only` keeps file:line backtraces — all we use in
# practice — while dropping variable-level DWARF, cutting target/ by ~60%.
# `split-debuginfo = "unpacked"` keeps that debuginfo in side .dwo files
# instead of copying it into every dependent binary, so the per-example
# binaries shrink from GBs to MBs. Mirrors web-dev/profiling, which already
# use line-tables-only. sccache does NOT affect target/ size — only rebuild
# speed — so this profile change is the actual disk-fill fix.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.lunco-physics]
opt-level = 3

# Live scalar-port admission and exchange kernels retain development assertions.
[profile.dev.package.lunco-port-core]
opt-level = 3

[profile.dev.package.lunco-cosim]
opt-level = 3

# Named observation admission runs on the authoritative application boundary.
[profile.dev.package.lunco-modelica-worker]
opt-level = 3

# Certified f64 surface queries instantiate their map and polynomial kernels here.
[profile.dev.package.lunco-terrain-surface]
opt-level = 3

# This installer monomorphizes native physics systems with the USD pair hook.
[profile.dev.package.lunco-luncosim-simulation]
opt-level = 3

# Keep Avian's overflow checks enabled in development. Physics teardown is
# explicitly retired through Avian's graph-removal components above, so the
# development profile must retain the engine's assertions as a real invariant
# check rather than suppressing a crash.
[profile.dev.package.avian3d]
opt-level = 3
overflow-checks = true

# ── Release profile (native, speed-first) ────────────────────────────
# Default `cargo build --release` targets native binaries. Wants runtime
# speed, not binary size. Earlier this profile was tuned for the wasm web
# build (`opt-level = "z"`, `lto = "fat"`, `codegen-units = 1`) which
# pessimised native — every native release ran with shrink-first codegen
# and the link took minutes due to fat LTO. The wasm tuning now lives in
# `[profile.web-release]` below; the wasm build scripts use that.
[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Wasm web build: optimise for download/compile-in-browser size. Used by
# `scripts/build_web.sh` and `scripts/build_rover.sh` via `--profile
# web-release`. Output lands in `target/wasm32-unknown-unknown/web-release/`.
#
# - opt-level = "z": shrink-first (default "3" favours runtime speed).
#   Typical wasm gain: 5–15 %.
# - lto = "fat": cross-crate inlining + DCE across the whole workspace.
# - codegen-units = 1: whole-crate codegen, slightly smaller output.
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
# `panic = "abort"` drops the unwinding tables and panic-formatting
# machinery from the wasm. Typical gain: ~5–10 % on a release build.
# Safe on wasm — there's no host that catches panics; a panic
# terminates the module either way, we just skip the unwind metadata.
panic = "abort"

# Wasm web build, fast-iteration variant. Used by `scripts/build_web.sh
# build <bin> --dev` for inner-loop development — produces a larger
# wasm but compiles+links in a fraction of the time of `web-release`
# (no fat LTO, no shrink-first codegen, parallel codegen units). The
# build script also skips the `wasm-opt` post-pass when this profile
# is selected. Use `web-release` for what users actually load.
[profile.web-dev]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = false
debug = "line-tables-only"
incremental = true

# Profile for samply / perf — release codegen with line-table debug info so
# stacks symbolicate to function names. Strip is off; otherwise identical to
# release. Build with `cargo run --profile profiling --bin ...`.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[patch.crates-io]
bevy_shader = { git = "https://github.com/LunCoSim/bevy", rev = "a12e8366cdd9c0ee8dabd3ada7bb7e8f02f0b338" }
# Pinned upstream source with the approved public path-tracing ordering hook.
# See third_party/bevy_solari/VENDOR.md for identity and the exact patch.
bevy_solari = { path = "third_party/bevy_solari" }
avian3d = { git = "https://github.com/LunCoSim/avian", rev = "9097ce92e5d236c747a68567368575014c28fff5" }
transform-gizmo-bevy = { git = "https://github.com/LunCoSim/mitchty-transform-gizmo", rev = "01302a171ac3db662c0c322ef9e98fe7d5f33a6a" }
