<template>
  <property name="vehicle">No simulation selected</property>
  <property name="status">WAITING</property>
  <property name="status_color">var(--muted-color)</property>
  <property name="ground_speed">—</property>
  <property name="lateral_speed">—</property>
  <property name="vertical_speed">—</property>
  <property name="altitude">—</property>
  <property name="propellant">—</property>
  <property name="propellant_width">0%</property>
  <property name="roll">—</property>
  <property name="pitch">—</property>
  <property name="yaw">—</property>
  <property name="spin">—</property>
  <property name="rcs_activity">0%</property>
  <property name="rcs_activity_width">0%</property>
  <property name="rcs_axis">OFF</property>
  <property name="torque_x">—</property>
  <property name="torque_y">—</property>
  <property name="torque_z">—</property>
  <property name="main_engine">—</property>

  <node id="control-response-root">
    <node id="control-response-heading">
      <node>
        <text id="control-response-kicker">DESCENT HUD</text>
        <text id="control-response-vehicle">{vehicle}</text>
      </node>
      <text id="control-response-status">{status}</text>
    </node>

    <text id="control-response-explanation">
      GNC slows sideways drift and the fall. RCS turns the vehicle. The main engine brakes the descent.
    </text>

    <node id="control-response-flight">
      <node id="control-response-flight-speed">
        <text id="control-response-flight-title">MOTION RELATIVE TO GROUND</text>
        <node id="control-response-flight-readouts">
          <node id="control-response-ground-speed">
            <text id="control-response-ground-speed-label">GROUND SPEED</text>
            <text id="control-response-ground-speed-value">{ground_speed}</text>
          </node>
          <node id="control-response-lateral-speed">
            <text id="control-response-lateral-speed-label">LEFT / RIGHT</text>
            <text id="control-response-lateral-speed-value">{lateral_speed}</text>
          </node>
          <node id="control-response-vertical-speed">
            <text id="control-response-vertical-speed-label">VERTICAL</text>
            <text id="control-response-vertical-speed-value">{vertical_speed}</text>
          </node>
          <node id="control-response-altitude">
            <text id="control-response-altitude-label">ALTIMETER</text>
            <text id="control-response-altitude-value">{altitude}</text>
          </node>
        </node>
      </node>

      <node id="control-response-fuel">
        <node id="control-response-fuel-heading">
          <text id="control-response-fuel-label">PROPELLANT LEFT</text>
          <text id="control-response-fuel-value">{propellant}</text>
        </node>
        <node id="control-response-fuel-track">
          <node id="control-response-fuel-fill" />
        </node>
      </node>
    </node>

    <node id="control-response-lower">
      <node id="control-response-attitude">
        <text id="control-response-attitude-title">ATTITUDE</text>
        <node id="control-response-attitude-body">
          <node id="control-response-attitude-ball">
            <node id="control-response-attitude-ball-horizon" />
            <node id="control-response-attitude-ball-crosshair" />
            <text id="control-response-attitude-ball-mark">UP</text>
          </node>
          <node id="control-response-attitude-values">
            <text id="control-response-attitude-roll">ROLL {roll}</text>
            <text id="control-response-attitude-pitch">PITCH {pitch}</text>
            <text id="control-response-attitude-yaw">YAW {yaw}</text>
            <text id="control-response-attitude-spin">SPIN {spin}</text>
          </node>
        </node>
      </node>

      <node id="control-response-actuation">
        <text id="control-response-actuation-title">ACTUATORS</text>
        <node id="control-response-actuation-rcs">
          <node id="control-response-actuation-rcs-heading">
            <text id="control-response-actuation-rcs-label">RCS FIRING</text>
            <text id="control-response-activity-value">{rcs_activity}</text>
          </node>
          <text id="control-response-rcs-axis">{rcs_axis}</text>
          <node id="control-response-activity-track">
            <node id="control-response-activity-fill" />
          </node>
        </node>
        <node id="control-response-torque-grid">
          <text id="control-response-torque-x">P {torque_x}</text>
          <text id="control-response-torque-y">Y {torque_y}</text>
          <text id="control-response-torque-z">R {torque_z}</text>
        </node>
        <node id="control-response-main-engine">
          <text id="control-response-main-engine-label">MAIN ENGINE</text>
          <text id="control-response-main-engine-value">{main_engine}</text>
        </node>
      </node>
    </node>

    <text id="control-response-footer">IMU + ALTIMETER · REAL VALVES · MODEL-BASED ENGINE</text>
  </node>
</template>
