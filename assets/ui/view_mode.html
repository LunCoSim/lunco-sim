<template>
  <property name="surface_background">var(--button-background)</property>
  <property name="surface_color">var(--muted-color)</property>
  <property name="moon_display">none</property>
  <property name="moon_background">var(--button-background)</property>
  <property name="moon_color">var(--muted-color)</property>
  <property name="earth_display">none</property>
  <property name="earth_background">var(--button-background)</property>
  <property name="earth_color">var(--muted-color)</property>

  <node id="runtime-view-mode-root">
    <node id="runtime-view-mode-card">
      <node id="runtime-view-mode-segmented">
        <button id="runtime-view-mode-surface" on_press="runtime_view_surface">
          <text>Surface</text>
        </button>
        <button id="runtime-view-mode-moon" on_press="runtime_view_moon">
          <text>Moon</text>
        </button>
        <button id="runtime-view-mode-earth" on_press="runtime_view_earth">
          <text>Earth</text>
        </button>
      </node>
    </node>
  </node>
</template>
