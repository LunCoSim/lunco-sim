<template>
  <property name="vehicle">LANDER</property>
  <property name="status">WAITING</property>
  <property name="status_color">var(--muted-color)</property>
  <property name="ground_speed">—</property>
  <property name="lateral_speed">—</property>
  <property name="vertical_speed">—</property>
  <property name="vertical_direction">—</property>
  <property name="altitude">—</property>
  <property name="target_offset">—</property>
  <property name="predicted_impact">—</property>
  <property name="propellant">—</property>
  <property name="propellant_width">0%</property>
  <property name="roll">—</property>
  <property name="pitch">—</property>
  <property name="yaw">—</property>
  <property name="rcs_activity">0%</property>
  <property name="rcs_activity_width">0%</property>
  <property name="rcs_axis">OFF</property>
  <property name="main_engine">—</property>
  <property name="main_engine_width">0%</property>
  <property name="main_engine_color">var(--muted-color)</property>

  <node id="compact-control-root">
    <node id="compact-control-header">
      <text id="compact-control-vehicle">{vehicle}</text>
      <node id="compact-control-status-chip">
        <node id="compact-control-status-marker" />
        <text id="compact-control-status">{status}</text>
      </node>
    </node>

    <node id="compact-vertical-primary">
      <text id="compact-vertical-primary-direction">{vertical_direction}</text>
      <text id="compact-vertical-primary-value">{vertical_speed}</text>
    </node>

    <node id="compact-control-motion-grid">
      <node id="compact-ground"><text id="compact-ground-label">HORIZ</text><text id="compact-ground-value">{ground_speed}</text></node>
      <node id="compact-altitude"><text id="compact-altitude-label">ALT</text><text id="compact-altitude-value">{altitude}</text></node>
    </node>

    <node id="compact-control-bottom">
      <node id="compact-engine-status">
        <text id="compact-engine-label">MAIN</text>
        <node id="compact-engine-meter"><node id="compact-engine-fill" /></node>
      </node>
      <text id="compact-rcs-value">RCS {rcs_axis} {rcs_activity}</text>
    </node>
  </node>
</template>
