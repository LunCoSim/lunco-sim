# Application policy bindings. The hook id and Rhai entry point are authored
# here so changing policy selection does not require a Rust rebuild.
#
# Entries default to optional. A hook owner decides whether an absent policy is
# a valid unconfigured state; `required = true` marks seams that need an authored
# implementation before they can operate safely. Policies owned by optional
# application features can set `skip_when_hook_unavailable = true`; the runtime
# then reports them as unavailable when that owner is not linked.

kind = "lunco.policy.v1"
scope = "application"

[startup]
source = "startup.rhai"
entry = "install_policies"

[[policies]]
hook = "control.authority.take"
source = "control_authority.rhai"
entry = "may_take_control"

[[policies]]
hook = "readiness.action"
source = "readiness.rhai"
entry = "readiness_action"
deterministic = true

[[policies]]
hook = "scene.time.select"
source = "scene_time.rhai"
entry = "select_scene_time"
deterministic = true
required = true

[[policies]]
hook = "physics.body_escape"
source = "physics_escape.rhai"
entry = "escaped_body_policy"
deterministic = true
required = true

[[policies]]
hook = "assets.provision"
source = "dataset_provisioning.rhai"
entry = "dataset_provisioning"

[[policies]]
hook = "assets.download.prepare"
source = "asset_download_prepare.rhai"
entry = "asset_download_prepare"
skip_when_hook_unavailable = true

[[policies]]
hook = "render.quality_profile"
source = "render_quality_profiles.rhai"
entry = "render_quality_profile"
deterministic = true
required = true

[[policies]]
hook = "render.default_quality_profile"
source = "render_quality_profiles.rhai"
entry = "default_render_quality_profile"
deterministic = true
required = true

[[policies]]
hook = "render.shadow_quality"
source = "render_shadow_quality.rhai"
entry = "shadow_quality"
skip_when_hook_unavailable = true

[[policies]]
hook = "runtime.ui.visibility"
source = "runtime_ui_surface.rhai"
entry = "runtime_ui_surface"

[[policies]]
hook = "runtime.ui.properties"
source = "runtime_ui_properties.rhai"
entry = "runtime_ui_properties"

[[policies]]
hook = "runtime.ui.recording"
source = "runtime_ui_recording.rhai"
entry = "runtime_ui_recording"
skip_when_hook_unavailable = true

[[policies]]
hook = "camera.default_presentation"
source = "camera_presentation.rhai"
entry = "default_presentation"

[[policies]]
hook = "twin.lifecycle"
source = "twin_lifecycle.rhai"
entry = "twin_lifecycle"

[[policies]]
hook = "application.asset.lifecycle"
source = "application_asset_lifecycle.rhai"
entry = "application_asset_lifecycle"
required = true

[[policies]]
hook = "scripting.source.classify"
source = "source_classification.rhai"
entry = "classify_source"
required = true

[[policies]]
hook = "link.connected"
source = "link.rhai"
entry = "link_connected"
deterministic = true

[[policies]]
hook = "synth.acausal-network"
source = "synth_acausal_network.rhai"
entry = "synthesize"
deterministic = true

[[policies]]
hook = "synth.actuator-wrench"
source = "synth_actuator_wrench.rhai"
entry = "synthesize"
deterministic = true

[[policies]]
hook = "lint.usd"
source = "lint_usd.rhai"
entry = "lint_usd"
deterministic = true

[[policies]]
hook = "lint.rhai"
source = "lint_rhai.rhai"
entry = "lint_rhai"
deterministic = true

[[policies]]
hook = "lint.modelica"
source = "lint_modelica.rhai"
entry = "lint_modelica"
deterministic = true

[[policies]]
hook = "lint.sysml"
source = "lint_sysml.rhai"
entry = "lint_sysml"
deterministic = true

[[policies]]
hook = "lint.twin"
source = "lint_twin.rhai"
entry = "lint_twin"
deterministic = true
