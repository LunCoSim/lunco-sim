# ============================================================================
# LunCoSim — manual development builds
# ============================================================================
# Builds LunCoSim as a native desktop binary for
# Linux (x86_64), macOS (arm64 + x86_64 cross-compiled on Apple Silicon),
# and Windows (x86_64), packages each with assets + docs + skills + cache,
# and uploads Velopack packages as GitHub Actions artifacts. A versioned GitHub
# Release exposes only four clearly named installers. Machine-only Velopack
# feeds and packages are published under the same immutable version tag in
# `LunCoSim/lunco-sim-updates`.
#
# Trigger: manually from the Actions tab.
#   https://github.com/LunCoSim/lunco-sim/actions/workflows/dev.yml
#
# Each OS job downloads the cache assets LunCoSim needs, builds it, and
# packages it via scripts/build_native.sh.
# TODO(lunica-separate-repo): move Lunica's GitHub build/release pipeline to
# the future standalone Lunica repository.
# ============================================================================

name: Dev Builds

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Create versioned GitHub releases with the artifacts'
        type: boolean
        default: true
      signing_mode:
        description: 'Release signs with the production policy; test signs an Actions-only artifact; off creates a sample bundle for SignPath setup.'
        type: choice
        options:
          - release
          - test
          - off
        default: release
      release_version:
        description: 'SemVer2 version for test/off runs (for example 0.6.0-dev.1); release mode allocates the next version automatically.'
        type: string
        required: false

env:
  CARGO_TERM_COLOR: always
  VELOPACK_CLI_VERSION: '1.2.110-ge826545'

permissions:
  contents: read
  actions: read     # needed by the SignPath GitHub connector

# Serialize the two-repository publication so manual runs cannot interleave
# releases for different source revisions.
concurrency:
  group: desktop-dev-publication
  cancel-in-progress: false

jobs:
  # ── Determine the release version and signing mode once ─────────────────
  meta:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.metadata.outputs.date }}
      timestamp: ${{ steps.metadata.outputs.timestamp }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      version: ${{ steps.version.outputs.version }}
      msi_version: ${{ steps.version.outputs.msi_version }}
      signing_mode: ${{ steps.metadata.outputs.signing_mode }}
      build_matrix: ${{ steps.metadata.outputs.build_matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify dev release and signing contracts
        run: python3 -m unittest scripts.tests.test_msi_version scripts.tests.test_dev_release_contract scripts.tests.test_stage_dev_release scripts.tests.test_generate_dev_release_notes
      - name: Verify runtime font bundle targets
        run: python3 -m unittest scripts.tests.test_asset_bundle_contract
      - id: metadata
        env:
          SIGNING_MODE_INPUT: ${{ inputs.signing_mode }}
          MAKE_RELEASE_INPUT: ${{ inputs.make_release }}
          REF_NAME: ${{ github.ref }}
        run: |
          date=$(date -u +'%Y-%m-%d %H:%M UTC')
          timestamp=$(date -u +'%Y%m%dT%H%M%SZ')
          signing_mode="${SIGNING_MODE_INPUT:-release}"

          case "$signing_mode" in
            release|test|off) ;;
            *) echo "Invalid signing mode: '$signing_mode'" >&2; exit 1 ;;
          esac
          if [[ "$signing_mode" != release && "$MAKE_RELEASE_INPUT" != false ]]; then
            echo "Test/off signing modes only create Actions artifacts; set make_release=false." >&2
            exit 1
          fi
          if [[ "$signing_mode" == release && "$MAKE_RELEASE_INPUT" == true && "$REF_NAME" != refs/heads/main ]]; then
            echo "Published releases must be dispatched from the main branch." >&2
            exit 1
          fi

          # Test/off runs build only Windows; release runs build every desktop target.
          build_matrix=$(jq -cn --arg signing_mode "$signing_mode" '
            [
              {
                label: "Linux x86_64",
                os: "ubuntu-22.04",
                platform: "linux",
                arch: "x86_64",
                apt_pkgs: "libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev xorg-dev",
                cross_target: ""
              },
              {
                label: "macOS ARM64",
                os: "macos-15",
                platform: "macos",
                arch: "aarch64",
                apt_pkgs: "",
                cross_target: "x86_64-apple-darwin"
              },
              {
                label: "Windows x86_64",
                os: "windows-latest",
                platform: "windows",
                arch: "x86_64",
                apt_pkgs: "",
                cross_target: ""
              }
            ]
            | {include: (if $signing_mode == "release" then . else map(select(.platform == "windows")) end)}
          ')

          {
            echo "date=$date"
            echo "timestamp=$timestamp"
            echo "signing_mode=$signing_mode"
            echo "build_matrix=$build_matrix"
          } >> "$GITHUB_OUTPUT"
          echo "Preparing $signing_mode build ($timestamp)"
      - id: version
        env:
          SIGNING_MODE: ${{ steps.metadata.outputs.signing_mode }}
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
          UPDATES_GH_TOKEN: ${{ secrets.LUNCOSIM_UPDATES_TOKEN }}
        run: |
          # The app crate owns the product base version. Strip only its
          # development marker; do not rewrite Cargo.toml in CI.
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          base_version=$(jq -er '.packages[] | select(.name == "lunco-luncosim") | .version' <<< "$metadata")
          base_version="${base_version%-dev}"

          if [[ "$SIGNING_MODE" == release ]]; then
            if [ -n "$RELEASE_VERSION_INPUT" ]; then
              echo "Release versions are allocated automatically; leave release_version empty." >&2
              exit 1
            fi
            if [ -z "$UPDATES_GH_TOKEN" ]; then
              echo "Repository secret LUNCOSIM_UPDATES_TOKEN is required to allocate release versions." >&2
              exit 1
            fi
            published_assets=$(GH_TOKEN="$UPDATES_GH_TOKEN" gh api --paginate \
              "repos/LunCoSim/lunco-sim-updates/releases?per_page=100" \
              --jq '.[] | select(.draft == false) | .assets[].name')
            version=$(python3 scripts/msi_version.py --next-version "$base_version" <<< "$published_assets")
            python3 scripts/msi_version.py --check-published "$version" <<< "$published_assets"
          else
            if [ -z "$RELEASE_VERSION_INPUT" ]; then
              echo "Test/off runs require an explicit release_version, for example 0.6.0-dev.1." >&2
              exit 1
            fi
            version="$RELEASE_VERSION_INPUT"
          fi

          msi_version=$(python3 scripts/msi_version.py --version "$version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$version" >> "$GITHUB_OUTPUT"
          echo "msi_version=$msi_version" >> "$GITHUB_OUTPUT"

  # ── Build LunCoSim per OS ────────────────────────────────────────────────
  build:
    needs: meta
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.build_matrix) }}

    runs-on: ${{ matrix.os }}
    # Force bash on all platforms — our build scripts are bash. On Windows
    # GitHub runners, `shell: bash` uses Git Bash (pre-installed).
    defaults:
      run:
        shell: bash
    env:
      LUNCO_MSI_VERSION: ${{ needs.meta.outputs.msi_version }}
      # Point the asset pipeline at a project-local .cache/ so the build
      # script can find the packaged fonts. Without this,
      # cache_dir() falls back to an OS-specific path that varies per
      # runner. Using $PWD/.cache keeps everything in the workspace.
      LUNCOSIM_CACHE: ${{ github.workspace }}/.cache
      # Keep all matrix builds tied to one release identity.
      LUNCO_BUILD_TIMESTAMP: ${{ needs.meta.outputs.timestamp }}
      LUNCO_RELEASE_VERSION: ${{ needs.meta.outputs.version }}
      LUNCO_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET for Velopack CLI
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Setup .NET SDK for the Windows fork
        if: matrix.platform == 'windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install Velopack CLI
        if: matrix.platform != 'windows'
        run: |
          dotnet tool install --global vpk --version "$VELOPACK_CLI_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Match rust-toolchain.toml and OpenUSD's minimum compiler version.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rust-src

      - name: Check out Windows Velopack fork
        if: matrix.platform == 'windows'
        uses: actions/checkout@v4
        with:
          repository: LunCoSim/velopack
          ref: a968b15b422a3de0722e08992e83dda5d3d71a91
          path: .ci-velopack
          fetch-depth: 0

      - name: Build Windows Velopack CLI
        if: matrix.platform == 'windows'
        working-directory: .ci-velopack
        run: |
          cargo build --locked --release -j 4 -p velopack_bins --features windows --bin setup --bin stub --bin update
          cargo build --locked --release -j 4 -p velopack_wix
          # The source-built packaging CLI resolves helpers from target/debug;
          # ship the optimized native helpers through that lookup path.
          mkdir -p target/debug
          cp target/release/{setup.exe,stub.exe,update.exe,velopack_wix.dll} target/debug/
          dotnet build src/vpk/Velopack.Vpk/Velopack.Vpk.csproj -c Debug -f net8.0
          echo "$GITHUB_WORKSPACE/.ci-velopack/build/Debug/net8.0" >> "$GITHUB_PATH"

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux' && matrix.apt_pkgs != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.apt_pkgs }}

      # Cache the cargo registry + git checkouts. The target/ dir is
      # cached separately by swatinem/rust-cache which keys on
      # Cargo.lock + OS + rust-toolchain. sccache was removed — its
      # GitHub Actions cache backend (SCCACHE_GHA_ENABLED) is flaky
      # (Azure 400 outages kill the build at the first rustc invocation).
      # swatinem/rust-cache on target/ is the bigger, reliable win.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-registry-

      - name: Cache target directory
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      # Keep the downloaded and processed runtime payload across successful
      # dev runs. The manifest hash invalidates this cache when a source,
      # version, or integrity pin changes; the downloader still verifies every
      # restored file before packaging it.
      - name: Cache native runtime assets
        uses: actions/cache@v4
        with:
          path: .cache
          key: ${{ matrix.platform }}-native-assets-${{ hashFiles('assets/manifests/*.toml') }}
          restore-keys: |
            ${{ matrix.platform }}-native-assets-

      # ── Build + package LunCoSim (native arch) ──────────────────────────
      - name: Verify native destination identities
        run: cargo test --locked -j 4 -p lunco-storage --lib -- --exact path_identity::tests::destination_identity_covers_missing_descendants_and_native_aliases

      - name: Verify HFS macOS destination identities
        if: runner.os == 'macOS'
        run: |
          for filesystem in HFS+ HFSX; do
            image="$RUNNER_TEMP/lunco-path-identity-$filesystem.dmg"
            mount="$RUNNER_TEMP/lunco-path-identity-$filesystem"
            hdiutil create -size 128m -fs "$filesystem" -volname LuncoPathIdentity "$image"
            mkdir -p "$mount"
            hdiutil attach -nobrowse -mountpoint "$mount" "$image"
            trap 'hdiutil detach "$mount"' EXIT
            mkdir "$mount/tmp"
            TMPDIR="$mount/tmp" cargo test --locked -j 4 -p lunco-storage --lib -- --exact path_identity::tests::destination_identity_covers_missing_descendants_and_native_aliases
            hdiutil detach "$mount"
            trap - EXIT
          done

      # --velopack turns the complete staged directory into an installer,
      # update package, and channel feed. docs/ + AGENTS.md + all assets are
      # therefore part of the package's authoritative file set. The native
      # icon is generated from assets/icons/svg by build_native.sh and passed
      # to Velopack for executable, installer, and AppImage branding. The
      # Linux output is then extracted and checked for matching root desktop,
      # icon, .DirIcon, and StartupWMClass metadata.
      # Cache download runs automatically before staging (unless
      # --skip-download), so the .cache/ subdirs are populated in-place.
      - name: Build LunCoSim (desktop)
        run: ./scripts/build_native.sh luncosim --release --velopack --version "${{ needs.meta.outputs.version }}"

      # Reuse the desktop release profile and target cache. Only these native
      # storage/Twin/asset seams run; they need no GUI or Windows symlink privilege.
      - name: Verify native path contracts
        run: |
          cargo test --release --locked -j 4 --lib \
            -p lunco-storage -p lunco-twin -p lunco-assets-core -p lunco-assets-runtime -p lunco-assets-path -p lunco-workspace -p lunco-networking-scenario -p lunco-assets-datasets -p lunco-assets-download -p lunco-scripting-rhai-core -p lunco-modelica-core -p lunco-modelica-compiler \
            -- --exact \
            file_uri_tests::file_uris_preserve_native_paths_and_reject_invalid_addresses \
            file_uri_tests::authored_windows_references_use_native_identity_or_explicit_host_rejection \
            source_root_smoke::source_root_content_closure_preserves_native_discovery_paths \
            source_root_smoke::source_root_content_closure_is_stable_exact_and_portable \
            source_root_smoke::source_root_content_closure_rejects_incomplete_or_nonportable_sources \
            source_root_smoke::source_root_content_closure_keeps_package_read_failures_terminal \
            tests::asset_root_admission_reports_invalid_overrides_and_discovers_canonical_library \
            twin_source::tests::directory_root_designator_retains_mount_ownership_and_rejects_parent_escape \
            tests::portable_materialization_rejects_aliases_and_accepts_literal_names \
            tests::scenario_paths_admit_literal_names_and_reject_materialization_conflicts \
            manifest::tests::source_pool_names_preserve_literals_and_reject_nonportable_url_names \
            registry::tests::overlapping_process_outputs_are_rejected_during_registration \
            download::tests::every_download_scope_rejects_unsafe_dest_before_resolution \
            names::tests::accepts_one_normal_component \
            names::tests::rejects_path_or_empty_names \
            tests::open_uses_canonical_root_identity \
            manifest::tests::native_plugin_paths_are_twin_relative_and_enabled_by_default \
            tests::portable_file_names_reject_reserved_devices_and_nonportable_components \
            tests::portable_file_names_preserve_unicode_and_literal_filesystem_characters \
            lunco_source::native_resolution_contract_tests::native_resolution_edges_cli_ancestor_is_terminal \
            lunco_source::native_resolution_contract_tests::native_resolution_edges_scoped_file_uris_reject_foreign_files \
            lunco_source::native_resolution_contract_tests::native_resolution_edges_keep_verbatim_filename_semantics \
            lunco_source::native_resolution_contract_tests::native_resolution_edges_reader_uses_logical_relative_grammar \
            lunco_source::native_resolution_contract_tests::native_resolution_edges_posix_double_root_is_native_input \
            twin_source::tests::native_resolution_edges_directory_probe_distinguishes_files_from_errors \
            lunco_source::native_resolution_contract_tests::native_resolution_contract_preserves_first_entry_kind \
            registry::tests::native_resolution_contract_keeps_dataset_and_reader_precedence_equal \
            tests::relative_keeps_the_anchors_scheme \
            tests::root_relative_paths_reject_traversal_and_absolute_spellings \
            twin_source::tests::unsafe_overlay_paths_are_not_stored_or_read \
            models::tests::package_inventory_contract \
            library::resolution_tests::asset_resolution_contract \
            discovery::tests::catalog_inventory_contract \
            package_tree::scanner::tests::source_tree_reads_admitted_members_and_rejects_invalid_source \
            discovery::source_root_contract_tests::asset_resolution_contract \
            discovery::source_root_contract_tests::source_inventory_rejects_non_utf8_native_filenames \
            asset_path::tests::native_load_paths_keep_filesystem_characters_and_separate_labels \
            asset_path::tests::native_load_paths_reject_missing_retired_and_foreign_ownership \
            asset_path::tests::windows_native_load_paths_normalize_verbatim_mount_roots \
            lunco_source::tests::file_uri_reader_decodes_native_paths_and_rejects_invalid_input \
            twin_source::tests::register_twin_encodes_display_names_without_rebinding_retired_mounts \
            asset_path::tests::native_preparation_canonicalizes_aliases_and_rejects_retired_mounts \
            asset_directory_tests::directory_worker_preserves_source_and_rejects_retired_mounts \
            asset_path::tests::web_transport_encodes_literal_filename_components_once \
            tests::bounded_file_admission_preserves_runtime_identity_and_read_errors \
            file_storage::tests::bounded_directory_listing_retains_lexical_cap_without_full_materialization \
            file_storage::tests::cache_directory_transaction_serializes_independent_writers_and_releases_lock \
            file_storage::tests::cache_directory_transaction_streams_regular_metadata_without_following_links \
            file_storage::tests::cache_directory_transaction_serializes_child_process

      - name: Verify native artifact preparation and transfer recovery
        run: |
          cargo test --release --locked -j 4 --lib \
            -p lunco-assets-processing -p lunco-geotiff -p lunco-assets-datasets -p lunco-assets-download -p lunco-assets-transport -p lunco-usd-bevy-stage -p lunco-scripting-rhai-world \
            -- --exact \
            world_bridge::tests::source_closure_commit_waits_for_publication_and_rejects_cycles_atomically \
            native_paths::tests::composed_requirements_select_active_variants_arrays_and_samples \
            native_paths::tests::consumed_requirements_use_the_prepared_twin_search_identity \
            projection::tests::projected_reader_roundtrips_nodes_and_rejects_matrix_transforms \
            projection::tests::polar_hemispheres_longitudes_and_offsets_are_general \
            pipeline::tests::recipe_transaction_customization_integrity_and_failed_replacement \
            pipeline::tests::external_process_uses_declared_inputs_and_validates_its_artifact \
            download::tests::staged_install_replaces_a_directory_and_version_as_one_commit \
            download::tests::cancelled_staged_install_leaves_the_previous_payload_intact \
            download::tests::failed_transfer_closes_staging_and_allows_retry_in_literal_paths \
            tests::byte_download_resumes_a_truncated_response \
            tests::shared_retry_policy_stops_on_non_retryable_or_cancelled_errors

      - name: Verify Windows literal filename runtime
        if: matrix.platform == 'windows'
        env:
          LUNCOSIM_EPHEMERAL_SETTINGS: '1'
          LUNCOSIM_ISOLATED_RUN: '1'
          LUNCOSIM_CONFIG: target/windows-path-contracts-config
        run: |
          target/release/luncosim.exe test \
            --scene assets/scenes/tests/twin_search_paths/sim/scenes/search_paths.usda \
            --api 4192 --threads 1 --max-ticks 3600 --verdict-channel TWIN_SEARCH_PATHS

      - name: Verify Windows network admission contracts
        if: matrix.platform == 'windows'
        run: |
          cargo test --release --locked -j 4 -p lunco-networking \
            --features networking --lib -- --exact \
            endpoint::tests::network_endpoint_configuration_preserves_hostname_ipv4_ipv6_and_explicit_port \
            endpoint::tests::network_endpoint_configuration_rejects_invalid_explicit_input \
            mode_configuration_tests::network_mode_configuration_requires_explicit_host_in_all_headless_launches \
            mode_configuration_tests::network_mode_configuration_rejects_invalid_missing_duplicate_and_conflicting_flags \
            mode_configuration_tests::network_host_configuration_rejects_zero_port_before_admission \
            mode_configuration_tests::network_mode_configuration_browser_override_decodes_and_rejects_invalid_requests \
            mode_configuration_tests::network_mode_configuration_rejects_unpaired_windows_surrogate_without_panicking \
            wt_client::native_socket_tests::network_endpoint_socket_family_matches_literal_ip_and_dns_default \
            server::configuration_tests::tls_path_configuration_rejects_incomplete_and_preserves_native_paths \
            server::configuration_tests::host_bind_rejects_invalid_and_public_development_admission \
            server::configuration_tests::tls_identity_validates_key_and_certificate_before_admission \
            server::configuration_tests::tls_windows_drive_and_unc_paths_use_native_sibling_resolution \
            wt_client::configuration_tests::certificate_pin_rejects_invalid_explicit_input_and_preserves_valid_bytes \
            shared::tests::key_parser_rejects_zero_and_wrong_length \
            shared::tests::key_parser_accepts_32_bytes_of_hex

      # Submit to SignPath only after the Windows release checks pass, so a
      # failed build does not leave a production approval request pending.
      - name: Prepare SignPath input bundle
        if: matrix.platform == 'windows'
        id: signpath-input
        run: |
          input_dir="dist/signpath-input"
          package_dir="dist/luncosim-windows-x86_64"
          vpk_dir="dist/velopack-windows-x86_64"
          mapfile -t msi_files < <(find "$vpk_dir" -maxdepth 1 -type f -iname '*.msi' -print)
          if [ "${#msi_files[@]}" -ne 1 ]; then
            echo "Expected one candidate MSI in $vpk_dir; found ${#msi_files[@]}." >&2
            exit 1
          fi
          if [ ! -f "$package_dir/luncosim.exe" ]; then
            echo "Staged LunCoSim executable is missing." >&2
            exit 1
          fi
          rm -rf "$input_dir"
          mkdir -p "$input_dir"
          cp "$package_dir/luncosim.exe" "$input_dir/luncosim.exe"
          cp "${msi_files[0]}" "$input_dir/LunCoSim-Windows-x86_64.msi"
          echo "msi_name=$(basename "${msi_files[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload SignPath input bundle
        if: matrix.platform == 'windows'
        id: upload-signpath-input
        uses: actions/upload-artifact@v4
        with:
          name: luncosim-signpath-input-${{ needs.meta.outputs.version }}
          path: dist/signpath-input/*
          if-no-files-found: error
          retention-days: 2

      - name: Verify SignPath configuration
        if: matrix.platform == 'windows' && needs.meta.outputs.signing_mode != 'off'
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          SIGNPATH_TEST_POLICY_SLUG: ${{ vars.SIGNPATH_TEST_POLICY_SLUG }}
          SIGNPATH_RELEASE_POLICY_SLUG: ${{ vars.SIGNPATH_RELEASE_POLICY_SLUG }}
          SIGNING_MODE: ${{ needs.meta.outputs.signing_mode }}
        run: |
          for setting in SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_ARTIFACT_CONFIGURATION_SLUG; do
            if [ -z "${!setting}" ]; then
              echo "GitHub secret/variable $setting is required for SignPath signing." >&2
              exit 1
            fi
          done
          if [ "$SIGNING_MODE" = test ] && [ -z "$SIGNPATH_TEST_POLICY_SLUG" ]; then
            echo "GitHub variable SIGNPATH_TEST_POLICY_SLUG is required for test signing." >&2
            exit 1
          fi
          if [ "$SIGNING_MODE" = release ] && [ -z "$SIGNPATH_RELEASE_POLICY_SLUG" ]; then
            echo "GitHub variable SIGNPATH_RELEASE_POLICY_SLUG is required for release signing." >&2
            exit 1
          fi

      - name: Sign Windows executable and MSI with SignPath
        if: matrix.platform == 'windows' && needs.meta.outputs.signing_mode != 'off'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ needs.meta.outputs.signing_mode == 'test' && vars.SIGNPATH_TEST_POLICY_SLUG || vars.SIGNPATH_RELEASE_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-signpath-input.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          wait-for-completion: true
          # SignPath Foundation release requests require manual approval.
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: dist/signpath-signed
          parameters: |
            version: ${{ toJSON(needs.meta.outputs.version) }}

      - name: Repack updates from the signed executable
        if: matrix.platform == 'windows' && needs.meta.outputs.signing_mode != 'off'
        env:
          MSI_NAME: ${{ steps.signpath-input.outputs.msi_name }}
          RELEASE_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          signed_dir="dist/signpath-signed"
          package_dir="dist/luncosim-windows-x86_64"
          vpk_dir="dist/velopack-windows-x86_64"
          signed_exe="$signed_dir/luncosim.exe"
          signed_msi="$signed_dir/LunCoSim-Windows-x86_64.msi"
          if [ ! -f "$signed_exe" ] || [ ! -f "$signed_msi" ]; then
            echo "SignPath output must contain luncosim.exe and LunCoSim-Windows-x86_64.msi." >&2
            exit 1
          fi
          cp "$signed_exe" "$package_dir/luncosim.exe"
          ./scripts/build_native.sh luncosim --release --velopack --pack-only --without-msi \
            --version "$RELEASE_VERSION" \
            --out "$package_dir" \
            --velopack-out "$vpk_dir"
          cp "$signed_msi" "$vpk_dir/$MSI_NAME"

      - name: Verify Windows signatures and signed update payload
        if: matrix.platform == 'windows' && needs.meta.outputs.signing_mode != 'off'
        shell: pwsh
        env:
          SIGNING_MODE: ${{ needs.meta.outputs.signing_mode }}
        run: |
          function Assert-AuthenticodeSignature([string]$Path) {
            $signature = Get-AuthenticodeSignature -FilePath $Path
            if ($null -eq $signature.SignerCertificate -or $signature.Status -in @('NotSigned', 'HashMismatch')) {
              throw "Missing or invalid Authenticode signature: $Path ($($signature.Status))"
            }
            if ($env:SIGNING_MODE -eq 'release' -and $signature.Status -ne 'Valid') {
              throw "Release signature is not trusted by the runner: $Path ($($signature.Status))"
            }
          }

          Assert-AuthenticodeSignature "dist/luncosim-windows-x86_64/luncosim.exe"
          $msis = @(Get-ChildItem "dist/velopack-windows-x86_64" -Filter '*.msi' -File)
          if ($msis.Count -ne 1) { throw "Expected one MSI in the final Windows package." }
          $msi = $msis[0]
          Assert-AuthenticodeSignature $msi.FullName

          $packages = @(Get-ChildItem "dist/velopack-windows-x86_64" -Filter '*win-x64-full.nupkg' -File)
          if ($packages.Count -ne 1) { throw "Expected one full Velopack package." }
          $package = $packages[0]
          $extract = Join-Path $env:RUNNER_TEMP 'luncosim-signed-update-check'
          $zip = Join-Path $env:RUNNER_TEMP 'luncosim-signed-update-check.zip'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath $package.FullName -Destination $zip -Force
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $packagedExe = Get-ChildItem $extract -Recurse -Filter 'luncosim.exe' -File | Select-Object -First 1
          if ($null -eq $packagedExe) {
            throw "Full Velopack package does not contain luncosim.exe: $($package.FullName)"
          }
          Assert-AuthenticodeSignature $packagedExe.FullName

      # ── Cross-compile (macOS x86_64 on Apple Silicon) ───────────────────
      # Only runs when the matrix entry sets `cross_target`. Adds the
      # rustup target, then runs build_native.sh again with --target so the
      # x86_64 binary lands in dist/<binary>-macos-x86_64/. The cross
      # build recompiles all deps for the new target (separate
      # target/<triple>/ dir), so it's ~as long as the native build —
      # but avoids the unavailable macos-13 runner entirely.
      - name: Add cross-compile target
        if: matrix.cross_target != ''
        run: rustup target add ${{ matrix.cross_target }}

      - name: Build LunCoSim (cross ${{ matrix.cross_target }})
        if: matrix.cross_target != ''
        run: ./scripts/build_native.sh luncosim --release --velopack --version "${{ needs.meta.outputs.version }}" --target ${{ matrix.cross_target }} --skip-download

      # ── Upload artifacts (native arch) ──────────────────────────────────
      - name: Upload LunCoSim artifact
        uses: actions/upload-artifact@v4
        with:
          name: luncosim-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/velopack-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30

      # ── Upload artifacts (cross-compile arch, macOS x86_64) ────────────
      # `platform_short` in build_native.sh maps *darwin* → "macos", so the
      # cross-compiled dist dir is dist/<bin>-macos-x86_64/ regardless of
      # which arch ran the build.
      - name: Upload LunCoSim (cross) artifact
        if: matrix.cross_target != ''
        uses: actions/upload-artifact@v4
        with:
          name: luncosim-macos-x86_64
          path: dist/velopack-macos-x86_64
          if-no-files-found: error
          retention-days: 30

  # ── Optional: publish a signed development release ─────────────────────
  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    if: needs.meta.outputs.signing_mode == 'release' && inputs.make_release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/raw

      # Keep the human download surface separate from the updater protocol.
      # The staging script validates every runtime feed and referenced package;
      # Portable archives and legacy RELEASES indexes are intentionally omitted.
      - name: Stage public installers and updater assets
        run: |
          python3 scripts/stage_dev_release.py \
            --input artifacts/raw \
            --public release/public \
            --updates release/updates
          echo "## Human downloads (development release)" >> "$GITHUB_STEP_SUMMARY"
          ls -lh release/public/ | tee -a "$GITHUB_STEP_SUMMARY"
          echo "## Machine updater assets (lunco-sim-updates release)" >> "$GITHUB_STEP_SUMMARY"
          ls -lh release/updates/ | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create development release
        env:
          RELEASE_DATE: ${{ needs.meta.outputs.date }}
          RELEASE_TAG: ${{ needs.meta.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.meta.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          MAIN_GH_TOKEN: ${{ github.token }}
          UPDATES_GH_TOKEN: ${{ secrets.LUNCOSIM_UPDATES_TOKEN }}
          UPDATES_REPOSITORY: LunCoSim/lunco-sim-updates
        run: |
          if [ -z "$UPDATES_GH_TOKEN" ]; then
            echo "Repository secret LUNCOSIM_UPDATES_TOKEN is required to publish updater releases." >&2
            exit 1
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo "The meta job did not provide a release tag; refusing to create an untagged release." >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "$RELEASE_VERSION" ]]; then
            echo "Release tag '$RELEASE_TAG' must match the package version '$RELEASE_VERSION'." >&2
            exit 1
          fi
          # Keep both app SemVer and the mapped three-part MSI version ahead
          # of published Windows packages.
          GH_TOKEN="$UPDATES_GH_TOKEN" gh api --paginate \
            "repos/$UPDATES_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false) | .assets[] | .name' |
            python3 scripts/msi_version.py --check-published "$RELEASE_VERSION"
          # Tag validation is fail-closed: do not let a transient fetch error
          # turn an existing-tag check into an unverified release creation.
          git fetch origin "+refs/tags/*:refs/tags/*"

          python3 scripts/generate_dev_release_notes.py \
            --from-ref latest \
            --to-ref "${{ github.sha }}" \
            --release-date "$RELEASE_DATE" \
            --repo-url "$REPO_URL" \
            --output release_notes.md

          # Check for an existing immutable traceability tag before asking the
          # Release API to create it. A rerun must use a new release tag rather
          # than replacing a published build that testers may already be using.
          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            existing_sha=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$existing_sha" != "${{ github.sha }}" ]; then
              echo "Tag $RELEASE_TAG already points at $existing_sha, not ${{ github.sha }}." >&2
              exit 1
            fi
          fi

          mapfile -d '' release_assets < <(find release/public -mindepth 1 -maxdepth 1 -type f -print0 | sort -z)
          mapfile -d '' update_packages < <(find release/updates -maxdepth 1 -type f \
            ! -name 'releases.*.json' -print0 | sort -z)
          mapfile -d '' update_feeds < <(find release/updates -maxdepth 1 -type f \
            -name 'releases.*.json' -print0 | sort -z)
          if [ "${#release_assets[@]}" -ne 4 ]; then
            echo "The development release must contain exactly four installers." >&2
            exit 1
          fi
          if [ "${#update_packages[@]}" -eq 0 ] || [ "${#update_feeds[@]}" -ne 4 ]; then
            echo "Updater staging must contain packages and exactly four runtime feeds." >&2
            exit 1
          fi

          cat > update_notes.md <<EOF
          Machine-readable Velopack update for [LunCoSim ${RELEASE_TAG}](${REPO_URL}/releases/tag/${RELEASE_TAG}).

          Source commit: [${{ github.sha }}](${REPO_URL}/commit/${{ github.sha }})

          Installers are published only in the linked LunCoSim release.
          EOF

          # Assemble both releases as drafts. They are published only after all
          # assets exist, making each version safe to mark immutable.
          if GH_TOKEN="$UPDATES_GH_TOKEN" gh release view "$RELEASE_TAG" --repo "$UPDATES_REPOSITORY" >/dev/null 2>&1; then
            echo "Updater release $UPDATES_REPOSITORY@$RELEASE_TAG already exists; refusing to replace it." >&2
            exit 1
          fi
          GH_TOKEN="$UPDATES_GH_TOKEN" gh release create "$RELEASE_TAG" \
            --repo "$UPDATES_REPOSITORY" \
            --target main \
            --title "LunCoSim updater $RELEASE_TAG" \
            --notes-file update_notes.md \
            --draft

          GH_TOKEN="$MAIN_GH_TOKEN" gh release create "$RELEASE_TAG" \
            --title "LunCoSim $RELEASE_VERSION" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --draft

          # Upload versioned packages before their feeds, then upload the four
          # human-facing installers to the main repository release.
          GH_TOKEN="$UPDATES_GH_TOKEN" gh release upload "$RELEASE_TAG" \
            --repo "$UPDATES_REPOSITORY" \
            "${update_packages[@]}"
          GH_TOKEN="$UPDATES_GH_TOKEN" gh release upload "$RELEASE_TAG" \
            --repo "$UPDATES_REPOSITORY" \
            "${update_feeds[@]}"
          GH_TOKEN="$MAIN_GH_TOKEN" gh release upload "$RELEASE_TAG" \
            "${release_assets[@]}"

          # Publish the complete updater release first. The human-facing
          # development release is the final success marker testers see.
          GH_TOKEN="$UPDATES_GH_TOKEN" gh release edit "$RELEASE_TAG" \
            --repo "$UPDATES_REPOSITORY" \
            --draft=false \
            --prerelease \
            --latest=false
          GH_TOKEN="$MAIN_GH_TOKEN" gh release edit "$RELEASE_TAG" \
            --draft=false \
            --latest=true
