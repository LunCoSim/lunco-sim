# ============================================================================
# LunCoSim — nightly desktop builds
# ============================================================================
# Builds LunCoSim as a native desktop binary for
# Linux (x86_64), macOS (arm64 + x86_64 cross-compiled on Apple Silicon),
# and Windows (x86_64), packages each with assets + docs + skills + cache,
# and uploads Velopack packages as GitHub Actions artifacts. A GitHub Release is
# created on scheduled runs or when `make_release` is true (default), with commit-derived notes
# generated by `skills/nightly-changelog`.
#
# Trigger: every night at 02:00 UTC, or manually from the Actions tab.
#   https://github.com/LunCoSim/lunco-sim/actions/workflows/nightly.yml
#
# Each OS job downloads the cache assets LunCoSim needs, builds it, and
# packages it via scripts/build_native.sh.
# TODO(lunica-separate-repo): move Lunica's GitHub build/release pipeline to
# the future standalone Lunica repository.
# ============================================================================

name: Nightly Builds

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Create a GitHub release with the artifacts'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (default: nightly-YYYYMMDDTHHMMSSZ). Use a custom tag like "nightly-20260802T-test" to avoid overwriting.'
        type: string
        required: false

env:
  CARGO_TERM_COLOR: always
  VELOPACK_CLI_VERSION: '1.2.110-ge826545'

permissions:
  contents: write   # needed for gh-release upload

jobs:
  # ── Determine the timestamp/tag once ────────────────────────────────────
  # The same UTC timestamp is used in the default release tag, making every
  # nightly artifact traceable to one build instant.
  # Override the tag with `release_tag` when a custom label is needed.
  meta:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.date.outputs.date }}
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: date
        run: echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"
      - id: timestamp
        run: echo "timestamp=$(date -u +'%Y%m%dT%H%M%SZ')" >> "$GITHUB_OUTPUT"
      - id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-${{ steps.timestamp.outputs.timestamp }}" >> "$GITHUB_OUTPUT"
          fi
      - id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          # The app crate owns the product base version. Strip only its
          # development marker; do not rewrite Cargo.toml in CI.
          base_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lunco-luncosim") | .version')
          base_version="${base_version%-dev}"
          version="${base_version}-nightly.${RUN_NUMBER}.${RUN_ATTEMPT}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # ── Build LunCoSim per OS ────────────────────────────────────────────────
  build:
    needs: meta
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
            # Bevy's Linux windowing stack (winit/wayland/x11) needs these
            # dev headers at build time. alsa = libasound2 (bevy_audio is
            # off, but alsa-sys may still be a transitive); udev = libudev
            # (winit); wayland + xkbcommon + x11 = the display backends.
            apt_pkgs: >-
              libasound2-dev libudev-dev
              libwayland-dev libxkbcommon-dev
              libx11-dev xorg-dev
            cross_target: ''    # no cross-compile on Linux

          - label: macOS ARM64
            os: macos-15
            platform: macos
            arch: aarch64
            apt_pkgs: ''
            # Cross-compile x86_64 on the SAME Apple Silicon runner (avoids
            # the chronically-unavailable macos-13 Intel runner). Adds the
            # x86_64-apple-darwin rustup target, then runs build_native.sh
            # twice more with --target. The cross builds use a separate
            # target/<triple>/ subdir so they don't overwrite the native ones.
            cross_target: x86_64-apple-darwin

          - label: Windows x86_64
            os: windows-latest
            platform: windows
            arch: x86_64
            apt_pkgs: ''
            cross_target: ''    # no cross-compile on Windows

    runs-on: ${{ matrix.os }}
    # Force bash on all platforms — our build scripts are bash. On Windows
    # GitHub runners, `shell: bash` uses Git Bash (pre-installed).
    defaults:
      run:
        shell: bash
    env:
      # Point the asset pipeline at a project-local .cache/ so the build
      # script can find the downloaded fonts / MSL / models. Without this,
      # cache_dir() falls back to an OS-specific path that varies per
      # runner. Using $PWD/.cache keeps everything in the workspace.
      LUNCOSIM_CACHE: ${{ github.workspace }}/.cache
      # Keep all matrix builds tied to one release identity.
      LUNCO_BUILD_TIMESTAMP: ${{ needs.meta.outputs.timestamp }}
      LUNCO_RELEASE_VERSION: ${{ needs.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET for Velopack CLI
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install Velopack CLI
        run: |
          dotnet tool install --global vpk --version "$VELOPACK_CLI_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # rust-toolchain.toml pins nightly-2026-02-27; the dtolnay action
      # honours it but we set the toolchain explicitly to be safe on
      # fresh runners where the file hasn't been read yet.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-27
          components: rust-src

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux' && matrix.apt_pkgs != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.apt_pkgs }}

      # Node.js is needed by `cargo run -p lunco-assets -- process -p
      # lunco-usd` (calls `npx @gltf-transform/cli` to strip Draco/WebP
      # extensions from the rover glTF). Pre-installed on GitHub runners,
      # but we set it up explicitly to guarantee a known version.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'latest'

      # Cache the cargo registry + git checkouts. The target/ dir is
      # cached separately by swatinem/rust-cache which keys on
      # Cargo.lock + OS + rust-toolchain. sccache was removed — its
      # GitHub Actions cache backend (SCCACHE_GHA_ENABLED) is flaky
      # (Azure 400 outages kill the build at the first rustc invocation).
      # swatinem/rust-cache on target/ is the bigger, reliable win.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-registry-

      - name: Cache target directory
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch }}

      # ── Build + package LunCoSim (native arch) ──────────────────────────
      # --velopack turns the complete staged directory into an installer,
      # update package, and channel feed. docs/ + AGENTS.md + all assets are
      # therefore part of the package's authoritative file set.
      # Cache download runs automatically before staging (unless
      # --skip-download), so the .cache/ subdirs are populated in-place.
      - name: Build LunCoSim (desktop)
        run: ./scripts/build_native.sh luncosim --release --velopack --version "${{ needs.meta.outputs.version }}"

      # ── Cross-compile (macOS x86_64 on Apple Silicon) ───────────────────
      # Only runs when the matrix entry sets `cross_target`. Adds the
      # rustup target, then runs build_native.sh again with --target so the
      # x86_64 binary lands in dist/<binary>-macos-x86_64/. The cross
      # build recompiles all deps for the new target (separate
      # target/<triple>/ dir), so it's ~as long as the native build —
      # but avoids the unavailable macos-13 runner entirely.
      - name: Add cross-compile target
        if: matrix.cross_target != ''
        run: rustup target add ${{ matrix.cross_target }}

      - name: Build LunCoSim (cross ${{ matrix.cross_target }})
        if: matrix.cross_target != ''
        run: ./scripts/build_native.sh luncosim --release --velopack --version "${{ needs.meta.outputs.version }}" --target ${{ matrix.cross_target }} --skip-download

      # ── Upload artifacts (native arch) ──────────────────────────────────
      - name: Upload LunCoSim artifact
        uses: actions/upload-artifact@v4
        with:
          name: luncosim-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/velopack-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30

      # ── Upload artifacts (cross-compile arch, macOS x86_64) ────────────
      # `platform_short` in build_native.sh maps *darwin* → "macos", so the
      # cross-compiled dist dir is dist/<bin>-macos-x86_64/ regardless of
      # which arch ran the build.
      - name: Upload LunCoSim (cross) artifact
        if: matrix.cross_target != ''
        uses: actions/upload-artifact@v4
        with:
          name: luncosim-macos-x86_64
          path: dist/velopack-macos-x86_64
          if-no-files-found: error
          retention-days: 30

  # ── Optional: create a GitHub Release with all artifacts ────────────────
  release:
    needs: [meta, build]
    runs-on: ubuntu-latest
    # Only create a release if the user opted in (default true for
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.make_release)
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Velopack creates one runtime-specific channel feed per matrix entry.
      # GitHub release assets cannot contain duplicate files from different
      # matrix jobs. Keep one feed per runtime and publish each package beside
      # that feed, so ARM64 and x86_64 clients never select each other's binary.
      - name: Merge Velopack feeds
        run: |
          mkdir -p artifacts
          for channel in linux-x64 osx-arm64 osx-x64 win-x64; do
            mapfile -t feed_files < <(find artifacts -mindepth 2 -type f -name "releases.${channel}.json" -print | sort)
            if [ "${#feed_files[@]}" -eq 0 ]; then
              echo "No Velopack feed found for runtime channel '$channel'." >&2
              exit 1
            fi
            jq -s '{Assets: (map(.Assets) | add // [] | unique_by(.FileName))}' \
              "${feed_files[@]}" > "artifacts/releases.${channel}.json"
          done

          # Copy packages/installers to the release root. The nested feeds are
          # deliberately omitted; the merged platform feeds above are the
          # authoritative copies published to GitHub.
          mapfile -t package_files < <(find artifacts -mindepth 2 -type f \
            ! -name 'releases.*.json' ! -name 'assets.*.json' -print | sort)
          for package_file in "${package_files[@]}"; do
            package_name="$(basename "$package_file")"
            if [ -e "artifacts/$package_name" ]; then
              echo "Duplicate Velopack package name: $package_name" >&2
              exit 1
            fi
            cp "$package_file" "artifacts/$package_name"
          done
          find artifacts -mindepth 2 -type f \( -name 'releases.*.json' -o -name 'assets.*.json' \) -delete
          find artifacts -mindepth 1 -type d -empty -delete || true
          package_count=$(find artifacts -maxdepth 1 -type f \
            ! -name 'releases.*.json' ! -name 'assets.*.json' | wc -l)
          if [ "$package_count" -lt 4 ]; then
            echo "Fewer than four Velopack runtime packages were downloaded." >&2
            exit 1
          fi
          echo "## Artifact listing" >> "$GITHUB_STEP_SUMMARY"
          ls -lh artifacts/ | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_DATE: ${{ needs.meta.outputs.date }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "+refs/tags/*:refs/tags/*" 2>/dev/null || true

          python3 skills/nightly-changelog/scripts/generate_changelog.py \
            --from-ref latest \
            --to-ref "${{ github.sha }}" \
            --release-date "$RELEASE_DATE" \
            --release-tag "$RELEASE_TAG" \
            --repo-url "$REPO_URL" \
            --output release_notes.md

          cat >> release_notes.md <<'EOF'

          See the [repository README](${{ github.server_url }}/${{ github.repository }}) for source builds and
          [report issues](${{ github.server_url }}/${{ github.repository }}/issues) for problems.
          EOF

          # Create an immutable traceability tag pointing at the exact commit
          # built. A rerun must use a new release tag rather than replacing a
          # published feed that installed clients may already be using.
          if git show-ref --tags --verify --quiet "refs/tags/${{ needs.meta.outputs.tag }}"; then
            existing_sha=$(git rev-list -n 1 "${{ needs.meta.outputs.tag }}")
            if [ "$existing_sha" != "${{ github.sha }}" ]; then
              echo "Tag ${{ needs.meta.outputs.tag }} already points at $existing_sha, not ${{ github.sha }}." >&2
              exit 1
            fi
          else
            git tag "${{ needs.meta.outputs.tag }}" "${{ github.sha }}"
            git push origin "${{ needs.meta.outputs.tag }}"
          fi

          # Create the release with the timestamped assets
          echo "Creating new release for ${{ needs.meta.outputs.tag }}..."
          gh release create "${{ needs.meta.outputs.tag }}" \
            --title "Nightly ${{ needs.meta.outputs.date }}" \
            --notes-file release_notes.md \
            --prerelease \
            artifacts/*
